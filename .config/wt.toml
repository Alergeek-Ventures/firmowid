# Worktrunk Project Configuration
# Enables isolated dev environments per worktree with deterministic ports

[pre-start]
# Copy deps, _build, .env from main worktree (uses COW/reflink when available)
copy_ignored = "wt step copy-ignored"
# Fix execute permissions on binaries (lost during COW copy on some filesystems)
remove_build = """
if [[ "$OSTYPE" != "darwin"* ]]; then
  rm -rf _build
fi
"""
deps = "mix deps.get"

# Generate .env.local with ports - main gets defaults, other branches get hashed ports
env = """
{% if branch == 'main' %}
cat > .env.local << 'EOF'
PORT=4000
DB_PORT=5433
S3_PORT=4566
CHROME_PORT=9222
DEBUGGER_PORT=9229
BRANCH=main
DATABASE_URL=postgresql://postgres:postgres@localhost:5433/firmowid

# AWS credentials for SeaweedFS S3 (required by ex_aws)
AWS_ACCESS_KEY_ID=test
AWS_SECRET_ACCESS_KEY=test
EOF
{% else %}
cat > .env.local << 'EOF'
PORT={{ branch | hash_port }}
DB_PORT={{ ('db-' ~ branch) | hash_port }}
S3_PORT={{ ('s3-' ~ branch) | hash_port }}
CHROME_PORT={{ ('chrome-' ~ branch) | hash_port }}
DEBUGGER_PORT={{ ('debugger-' ~ branch) | hash_port }}
BRANCH={{ branch | sanitize }}
DATABASE_URL=postgresql://postgres:postgres@localhost:{{ ('db-' ~ branch) | hash_port }}/firmowid

# AWS credentials for SeaweedFS S3 (required by ex_aws)
AWS_ACCESS_KEY_ID=test
AWS_SECRET_ACCESS_KEY=test
EOF
{% endif %}
"""

# Generate .opencode.port for AI tools
opencode = "{% if branch == 'main' %}echo '4000'{% else %}echo '{{ branch | hash_port }}'{% endif %} > .server.port"

# Start services (reads from .env.local)
up = "mix dev.up"

[pre-remove]
down = "mix dev.down"

[list]
url = """
if [[ "$HOME" == "kosciak"* ]]; then
  echo https://{{ branch | sanitize }}.firmowid.localhost
else
  echo "http://{{ branch | sanitize }}.firmowid.localhost:8080"
fi
"""
