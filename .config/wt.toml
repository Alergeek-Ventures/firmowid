# Worktrunk Project Configuration
# Enables isolated dev environments per worktree with deterministic ports.
#
# Every value is derived from the worktree directory name, which stays fixed when
# the branch is renamed. The pre-start hooks are idempotent: `wt hook pre-start --yes`
# sets up a worktree created without worktrunk and repairs an existing one.

# Phase 1: Copy deps/_build/.env from main worktree (existing files are kept)
[[pre-start]]
copy_ignored = "wt step copy-ignored"

# Phase 2: Everything else in parallel
# [[pre-start]]
# remove_build = """
# if [[ "$OSTYPE" != "darwin"* ]]; then
#   rm -rf _build
# fi
# """

[[pre-start]]
deps = "mix deps.get"
deps-js = "npm ci --prefix assets"

[[pre-start]]
env = """
{% if worktree_path == primary_worktree_path %}
cat > .env.worktree << 'EOF'
PORT=4000
DB_PORT=5433
S3_PORT=4566
GOTENBERG_PORT=3000
DEBUGGER_PORT=9229
BRANCH=main
DATABASE_URL=postgresql://postgres:postgres@localhost:5433/firmowid

# AWS credentials for SeaweedFS S3 (required by ex_aws)
AWS_ACCESS_KEY_ID=test
AWS_SECRET_ACCESS_KEY=test
EOF
{% else %}
cat > .env.worktree << 'EOF'
PORT={{ worktree_name | hash_port }}
DB_PORT={{ ('db-' ~ worktree_name) | hash_port }}
S3_PORT={{ ('s3-' ~ worktree_name) | hash_port }}
GOTENBERG_PORT={{ ('gotenberg-' ~ worktree_name) | hash_port }}
DEBUGGER_PORT={{ ('debugger-' ~ worktree_name) | hash_port }}
BRANCH={{ worktree_name | sanitize }}
DATABASE_URL=postgresql://postgres:postgres@localhost:{{ ('db-' ~ worktree_name) | hash_port }}/firmowid

# AWS credentials for SeaweedFs S3 (required by ex_aws)
AWS_ACCESS_KEY_ID=test
AWS_SECRET_ACCESS_KEY=test
EOF
{% endif %}
"""

[[pre-start]]
opencode = "{% if worktree_path == primary_worktree_path %}echo '4000'{% else %}echo '{{ worktree_name | hash_port }}'{% endif %} > .server.port"

# Phase 3: Start services (after everything else)
[[pre-start]]
up = "mix dev.up"

[pre-remove]
down = "mix dev.down"

[list]
url = "https://{% if worktree_path == primary_worktree_path %}main{% else %}{{ worktree_name | sanitize }}{% endif %}.firmowid.localhost"
