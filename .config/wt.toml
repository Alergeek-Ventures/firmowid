# Worktrunk Project Configuration
# Enables isolated dev environments per worktree with deterministic ports

# Phase 1: Copy deps/_build/.env from main worktree
[[pre-start]]
copy_ignored = "wt step copy-ignored"

# Phase 2: Everything else in parallel
# [[pre-start]]
# remove_build = """
# if [[ "$OSTYPE" != "darwin"* ]]; then
#   rm -rf _build
# fi
# """

[[pre-start]]
deps = "mix deps.get"
deps-js = "npm ci --prefix assets"

[[pre-start]]
env = """
{% if branch == 'main' %}
cat > .env.worktree << 'EOF'
PORT=4000
DB_PORT=5433
S3_PORT=4566
CHROME_PORT=9222
DEBUGGER_PORT=9229
BRANCH=main
DATABASE_URL=postgresql://postgres:postgres@localhost:5433/firmowid

# AWS credentials for SeaweedFS S3 (required by ex_aws)
AWS_ACCESS_KEY_ID=test
AWS_SECRET_ACCESS_KEY=test
EOF
{% else %}
cat > .env.worktree << 'EOF'
PORT={{ branch | hash_port }}
DB_PORT={{ ('db-' ~ branch) | hash_port }}
S3_PORT={{ ('s3-' ~ branch) | hash_port }}
CHROME_PORT={{ ('chrome-' ~ branch) | hash_port }}
DEBUGGER_PORT={{ ('debugger-' ~ branch) | hash_port }}
BRANCH={{ branch | sanitize }}
DATABASE_URL=postgresql://postgres:postgres@localhost:{{ ('db-' ~ branch) | hash_port }}/firmowid

# AWS credentials for SeaweedFs S3 (required by ex_aws)
AWS_ACCESS_KEY_ID=test
AWS_SECRET_ACCESS_KEY=test
EOF
{% endif %}
"""

[[pre-start]]
opencode = "{% if branch == 'main' %}echo '4000'{% else %}echo '{{ branch | hash_port }}'{% endif %} > .server.port"

# Phase 3: Start services (after everything else)
[[pre-start]]
up = "mix dev.up"

[pre-remove]
down = "mix dev.down"

[list]
url = "https://{% if branch == 'main' %}main{% else %}{{ branch | sanitize }}{% endif %}.firmowid.localhost"
