# Heading and introduction of /poradnik. Guides are Polish only, so this text is not translated.
heading: Poradnik KSeF i fakturowania dla małych firm
intro: Konkretne odpowiedzi dla JDG i małych firm. Od kiedy obowiązuje Cię KSeF, co robić przy awarii, jak wybrać program do faktur i połączyć go z bankiem. Każdy poradnik podaje źródła i datę ostatniej aktualizacji.
