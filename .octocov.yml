coverage:
  # One partial report per test partition of elixir-build-and-test.yml; octocov merges them.
  paths:
    - cover/excoveralls-lcov-report-1/lcov.info
    - cover/excoveralls-lcov-report-2/lcov.info

summary:
  if: true
  hideFooterLink: true

comment:
  if: is_pull_request
  updatePrevious: true
  hideFooterLink: true
