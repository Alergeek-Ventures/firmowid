# Development Docker Compose configuration
#
# Works standalone (defaults for main branch) or with env vars (worktree mode).
# Environment variables (set via .env.local for worktrees):
#   COMPOSE_PROJECT_NAME - e.g., firmowid-feature-auth (default: firmowid)
#   DB_PORT              - Postgres port (mapped to container 5432)
#   S3_PORT              - SeaweedFS S3 port (mapped to container 8333)
#   CHROME_PORT          - Chromium port (mapped to container 9222)

services:
  db:
    image: paradedb/paradedb:v0.22.3@sha256:5df9a7d78ad9b8c2fe1d4f0098b4cbd48c3e3e543925059d21465a81916830b7
    container_name: ${COMPOSE_PROJECT_NAME:-firmowid}-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: firmowid
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  s3:
    image: docker.io/chrislusf/seaweedfs:4.17@sha256:186de7ef977a20343ee9a5544073f081976a29e2d29ecf8379891e7bf177fbe9
    container_name: ${COMPOSE_PROJECT_NAME:-firmowid}-s3
    command: server -s3
    ports:
      - "${S3_PORT:-4566}:8333"
    environment:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    volumes:
      - seaweedfs_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8333/healthz"]
      interval: 5s
      timeout: 3s
      retries: 15

  chromium:
    build:
      context: ..
      dockerfile: deployment/Containerfile.chromium
    container_name: ${COMPOSE_PROJECT_NAME:-firmowid}-chromium
    ports:
      - "${CHROME_PORT:-9222}:9222"
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--fail",
          "--silent",
          "--show-error",
          "http://127.0.0.1:9222/json/version",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  postgres_data:
  seaweedfs_data:
