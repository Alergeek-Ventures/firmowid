# Development Docker Compose configuration
#
# Works standalone (defaults for main branch) or with env vars (worktree mode).
# Environment variables (set via .env.worktree for worktrees):
#   COMPOSE_PROJECT_NAME - e.g., firmowid-feature-auth (default: firmowid)
#   DB_PORT              - Postgres port (mapped to container 5432)
#   S3_PORT              - SeaweedFS S3 port (mapped to container 8333)
#   GOTENBERG_PORT       - Gotenberg port (mapped to container 3000)

services:
  db:
    image: docker.io/paradedb/paradedb:v0.26.0@sha256:52fc9c95fdfd462201168d1d82334ed61f85cbd921957cab083ec39800a217ac
    container_name: ${COMPOSE_PROJECT_NAME:-firmowid}-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: firmowid
      # The local database is disposable (`mix dev.up` recreates and seeds it), so
      # durability is traded for speed: flushing to disk took most of the startup.
      POSTGRES_INITDB_ARGS: --no-sync
      # Keep stock memory settings instead of 25% of host RAM per worktree.
      PDB_TUNE: "false"
    command: ["postgres", "-c", "fsync=off", "-c", "synchronous_commit=off", "-c", "full_page_writes=off"]
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  s3:
    build:
      context: ..
      dockerfile: deployment/Containerfile.seaweedfs
    container_name: ${COMPOSE_PROJECT_NAME:-firmowid}-s3
    ports:
      - "${S3_PORT:-4566}:8333"
    environment:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    volumes:
      - seaweedfs_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8333/healthz"]
      interval: 5s
      timeout: 3s
      retries: 15

  gotenberg:
    build:
      context: ..
      dockerfile: deployment/Containerfile.gotenberg
    container_name: ${COMPOSE_PROJECT_NAME:-firmowid}-gotenberg
    ports:
      - "${GOTENBERG_PORT:-3000}:3000"
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--fail",
          "--silent",
          "--show-error",
          "http://127.0.0.1:3000/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  postgres_data:
  seaweedfs_data:
