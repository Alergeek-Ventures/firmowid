services:
  postgres:
    image: paradedb/paradedb:latest
    container_name: redux-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

  localstack:
    image: localstack/localstack:latest
    container_name: localstack_main
    environment:
      - SERVICES=s3
      - AWS_DEFAULT_REGION=us-east-1
    ports:
      - "4566:4566"
    volumes:
      - ./s3-init/create-s3-bucket.sh:/etc/localstack/init/ready.d/create-s3-bucket.sh:Z
      - localstack_data:/var/lib/localstack

  chromium:
    build:
      context: ..
      dockerfile: deployment/Containerfile.chromium
    container_name: firmowid-chromium
    ports:
      - "9222:9222"
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--fail",
          "--silent",
          "--show-error",
          "http://127.0.0.1:9222/json/version",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  postgres_data:
  localstack_data:
