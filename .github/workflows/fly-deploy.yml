name: Fly Deploy
on:
  push:
    branches:
      - main
jobs:
  deploy:
    name: Deploy app
    runs-on: ubuntu-latest
    concurrency: deploy-group
    steps:
      - uses: actions/checkout@v4
      
      - name: Extract versions from .tool-versions
        id: versions
        run: |
          ELIXIR_FULL=$(grep "^elixir " .tool-versions | awk '{print $2}')
          ERLANG_REQUESTED=$(grep "^erlang " .tool-versions | awk '{print $2}')
          ELIXIR_VERSION=$(echo "$ELIXIR_FULL" | sed 's/-otp-.*//')
          
          # Query Docker Hub for matching image
          TAGS=$(curl -s "https://hub.docker.com/v2/repositories/hexpm/elixir/tags?page_size=100&name=${ELIXIR_VERSION}-erlang-${ERLANG_REQUESTED}" | \
                 jq -r '.results[].name | select(contains("debian") and contains("slim"))' | sort -V -r | head -1)
          
          if [ -z "$TAGS" ]; then
            echo "ERROR: No matching image found"
            exit 1
          fi
          
          OTP_VERSION=$(echo "$TAGS" | sed 's/.*erlang-\([0-9.]*\).*/\1/')
          DEBIAN_VERSION=$(echo "$TAGS" | sed 's/.*debian-\(.*\)/\1/')
          
          echo "elixir_version=$ELIXIR_VERSION" >> $GITHUB_OUTPUT
          echo "otp_version=$OTP_VERSION" >> $GITHUB_OUTPUT
          echo "debian_version=$DEBIAN_VERSION" >> $GITHUB_OUTPUT
      
      - uses: superfly/flyctl-actions/setup-flyctl@master
      
      - name: Deploy to Fly.io
        run: |
          flyctl deploy --remote-only \
            --build-arg ELIXIR_VERSION=${{ steps.versions.outputs.elixir_version }} \
            --build-arg OTP_VERSION=${{ steps.versions.outputs.otp_version }} \
            --build-arg DEBIAN_VERSION=${{ steps.versions.outputs.debian_version }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_KEY }}

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create Sentry release
        uses: getsentry/action-release@v3
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: "alergeek"
          SENTRY_PROJECT: "firmowid"
        with:
          environment: production
