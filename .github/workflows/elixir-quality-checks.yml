name: Elixir Quality Checks

on:
  workflow_call:
    inputs:
      catalog-version:
        description: Snapshot SHA in the translation artifact prepared by CI
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: elixir-quality-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  extract-versions:
    name: Extract versions from .tool-versions
    runs-on: selenge
    outputs:
      elixir: ${{ steps.versions.outputs.elixir }}
      otp: ${{ steps.versions.outputs.otp }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Extract versions
        id: versions
        run: |
          ELIXIR_FULL=$(grep "^elixir " .tool-versions | awk '{print $2}')
          OTP=$(grep "^erlang " .tool-versions | awk '{print $2}')
          ELIXIR=${ELIXIR_FULL/-otp-*/}

          echo "elixir=$ELIXIR" >> "$GITHUB_OUTPUT"
          echo "otp=$OTP" >> "$GITHUB_OUTPUT"

          echo "Detected from .tool-versions:"
          echo "  Elixir: $ELIXIR"
          echo "  OTP: $OTP"

  quality_checks:
    name: Formatting, Credo, and Unused Deps
    runs-on: selenge
    needs:
      - extract-versions

    env:
      MIX_ENV: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Download generated PO catalog
        uses: ./.github/actions/download-translations
        with:
          catalog-version: ${{ inputs.catalog-version }}

      - name: Setup Elixir Project
        id: setup
        uses: ./.github/actions/elixir-setup

      # Install npm asset dependencies, including the Tailwind CLI
      - name: Install npm asset dependencies
        id: npm
        run: npm ci --prefix assets

      - name: Check for unused deps
        run: mix deps.unlock --check-unused
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}

      - name: Check Hex dependency licenses
        run: mix depscheck
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}

      - name: Audit Hex dependencies
        run: mix hex.audit
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}

      - name: Audit npm dependencies
        run: mix assets.audit
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && steps.npm.outcome == 'success' }}

      - name: Check npm dependency licenses
        run: mix assets.licenses
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && steps.npm.outcome == 'success' }}

      - name: Check code formatting
        run: mix format --check-formatted
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}

      - name: Check for security vulnerabilities in Phoenix project
        run: mix sobelow --config
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}

      - name: Check Credo
        run: mix credo --strict
        env:
          # ExDNA fingerprints files in one task per scheduler, each with a 5 s limit. On a
          # busy selenge host 32 schedulers share far fewer free cores and tasks time out.
          ELIXIR_ERL_OPTIONS: "+S 8"
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}

      - name: Validate translation catalogs
        run: mix translations.check
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}

      # A Git tree includes file contents AND paths, including POT references.
      # Cache only successful validation of an identical tree/toolchain, never POTs.
      - name: Identify translation extraction inputs
        id: extraction_inputs
        run: echo "tree=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"

      - name: Restore translation extraction verification
        id: extraction_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: gettext-extraction-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.MIX_ENV }}-${{ steps.setup.outputs.otp-version }}-${{ steps.setup.outputs.elixir-version }}-${{ steps.extraction_inputs.outputs.tree }}
          path: _build/gettext-extraction/verified

      # Gettext 1.0 forces compilation even with --check-up-to-date. Keep that
      # authoritative check on a miss; an exact hit reuses its successful result.
      - name: Check translation extraction
        id: extraction
        env:
          CACHE_HIT: ${{ steps.extraction_cache.outputs.cache-hit }}
          SOURCE_TREE: ${{ steps.extraction_inputs.outputs.tree }}
        run: |
          if [ "$CACHE_HIT" = "true" ]; then
            test "$(cat _build/gettext-extraction/verified)" = "$SOURCE_TREE"
            echo "Gettext extraction already verified for this exact source tree and toolchain."
          else
            # DIAGNOSTIC ONLY: repeat the pair and print which inputs changed (names, never values).
            export GETTEXT_DIAG_DIR="$RUNNER_TEMP/gettext-diag"
            misses=0
            for i in 1 2 3 4 5 6; do
              rm -f _build/test/.gettext-extraction-check
              mix do loadpaths --no-compile --no-deps-check + diag.gettext "pair$i-before-run1"
              echo "pair$i before run1: $(erl -noshell -eval 'io:put_chars(erlang:system_info(system_version)), halt().' | grep -o 'smp:[0-9:]*') cpuset=$(cat /sys/fs/cgroup/cpuset.cpus.effective) nproc=$(nproc) quota=$(cat /sys/fs/cgroup/cpu.max)"
              mix translations.extract.check > "$RUNNER_TEMP/run1.log" 2>&1
              grep -cE "Compiling [0-9]+ files" "$RUNNER_TEMP/run1.log" | sed "s/^/pair$i run1 compile lines: /"
              last1=$(ls -1 "$GETTEXT_DIAG_DIR"/ctx-* | sort | tail -1)
              mix do loadpaths --no-compile --no-deps-check + diag.gettext "pair$i-before-run2"
              echo "pair$i before run2: $(erl -noshell -eval 'io:put_chars(erlang:system_info(system_version)), halt().' | grep -o 'smp:[0-9:]*') cpuset=$(cat /sys/fs/cgroup/cpuset.cpus.effective) nproc=$(nproc) quota=$(cat /sys/fs/cgroup/cpu.max)"
              mix translations.extract.check > "$RUNNER_TEMP/run2.log" 2>&1
              grep -E "Compiling [0-9]+ files|cached success" "$RUNNER_TEMP/run2.log" | sed "s/^/pair$i run2: /"
              first2=$(ls -1 "$GETTEXT_DIAG_DIR"/ctx-* | sort | grep -A1 -Fx "$last1" | tail -1)
              m1=$(ls -1 "$GETTEXT_DIAG_DIR"/manifest-pair$i-before-run1-*); m2=$(ls -1 "$GETTEXT_DIAG_DIR"/manifest-pair$i-before-run2-*)
              if grep -Fxq 'Gettext extraction verification unchanged (cached success).' "$RUNNER_TEMP/run2.log"; then
                echo "pair$i: HIT"
              else
                misses=$((misses + 1))
                echo "::warning::pair$i: MISS"
                echo "--- context keys that differ (run1 last vs run2 first):"
                diff <(sort "$last1") <(sort "$first2") | grep '^[<>]' | awk '{print $1, $2, $3}' | sort -u -k2 || true
                echo "--- manifest state before run1 / before run2:"
                diff "$m1" "$m2" | grep -vE '^[<>] label' || true
                cat "$m2" | grep -E '^(config_mtime|project_mtime|cwd_same|cache_key|dbg|lock|manifest_mtime|config_file)'
              fi
            done
            echo "misses: $misses of 6"
            mkdir -p _build/gettext-extraction
            printf '%s\n' "$SOURCE_TREE" > _build/gettext-extraction/verified
          fi

      - name: Save translation extraction verification
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.extraction_cache.outputs.cache-hit != 'true' && steps.extraction.outcome == 'success'
        with:
          key: ${{ steps.extraction_cache.outputs.cache-primary-key }}
          path: _build/gettext-extraction/verified

  # PLTs take ~10 min to build, so dialyzer runs alongside the other checks.
  dialyzer:
    name: Dialyzer
    runs-on: selenge
    needs:
      - extract-versions

    env:
      MIX_ENV: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Download generated PO catalog
        uses: ./.github/actions/download-translations
        with:
          catalog-version: ${{ inputs.catalog-version }}

      - name: Setup Elixir Project
        id: setup
        uses: ./.github/actions/elixir-setup

      - name: Restore core PLT cache
        id: core_plt_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: plt-core-v2-${{ runner.os }}-${{ runner.arch }}-${{ env.MIX_ENV }}-${{ steps.setup.outputs.otp-version }}-${{ steps.setup.outputs.elixir-version }}
          path: |
            _build/plts/core/*.plt
            _build/plts/core/*.plt.hash

      - name: Restore PLT cache
        id: plt_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: plt-v4-${{ runner.os }}-${{ runner.arch }}-${{ env.MIX_ENV }}-${{ steps.setup.outputs.otp-version }}-${{ steps.setup.outputs.elixir-version }}-${{ hashFiles('mix.lock') }}-${{ hashFiles('mix.exs', 'config/**/*.exs') }}
          # Updating a PLT built for another lock takes as long as rebuilding it
          # from the core PLT (~10 min), so only reuse PLTs of the same lock.
          restore-keys: |
            plt-v4-${{ runner.os }}-${{ runner.arch }}-${{ env.MIX_ENV }}-${{ steps.setup.outputs.otp-version }}-${{ steps.setup.outputs.elixir-version }}-${{ hashFiles('mix.lock') }}-
          path: |
            _build/test/*.plt
            _build/test/*.plt.hash

      # Dialyxir validates the lock/app selection; locked dependencies need no forced recheck.
      - name: Create or update PLTs
        id: plt_create
        if: steps.plt_cache.outputs.cache-hit != 'true'
        run: mix dialyzer --plt

      # Preserve successfully built PLTs even if analysis later finds warnings.
      - name: Save core PLT cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.core_plt_cache.outputs.cache-hit != 'true' && steps.plt_create.outcome == 'success'
        with:
          key: ${{ steps.core_plt_cache.outputs.cache-primary-key }}
          path: |
            _build/plts/core/*.plt
            _build/plts/core/*.plt.hash

      - name: Save PLT cache
        id: plt_cache_save
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.plt_cache.outputs.cache-hit != 'true' && steps.plt_create.outcome == 'success'
        with:
          key: ${{ steps.plt_cache.outputs.cache-primary-key }}
          path: |
            _build/test/*.plt
            _build/test/*.plt.hash

      - name: Run dialyzer
        # Two formats are included for ease of debugging and it is lightly recommended to use both, see https://github.com/jeremyjh/dialyxir/issues/530 for reasoning
        # --format github is helpful to print the warnings in a way that GitHub understands and can place on the /files page of a PR
        # --format dialyxir allows the raw GitHub actions logs to be useful because they have the full warning printed
        run: mix dialyzer --format github --format dialyxir
