name: Elixir Quality Checks

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "*"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  translations:
    name: Prepare translations
    uses: ./.github/workflows/translations-prepare.yml
    with:
      version: ${{ github.event.pull_request.head.sha || github.sha }}
    secrets:
      ACCENT_SNAPSHOT_API_KEY: ${{ secrets.ACCENT_SNAPSHOT_API_KEY }}
    permissions:
      contents: read

  extract-versions:
    name: Extract versions from .tool-versions
    runs-on: ubuntu-latest
    outputs:
      elixir: ${{ steps.versions.outputs.elixir }}
      otp: ${{ steps.versions.outputs.otp }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Extract versions
        id: versions
        run: |
          ELIXIR_FULL=$(grep "^elixir " .tool-versions | awk '{print $2}')
          OTP=$(grep "^erlang " .tool-versions | awk '{print $2}')
          ELIXIR=$(echo "$ELIXIR_FULL" | sed 's/-otp-.*//')

          echo "elixir=$ELIXIR" >> $GITHUB_OUTPUT
          echo "otp=$OTP" >> $GITHUB_OUTPUT

          echo "Detected from .tool-versions:"
          echo "  Elixir: $ELIXIR"
          echo "  OTP: $OTP"

  quality_checks:
    name: Formatting, Credo, and Unused Deps
    runs-on: ubuntu-latest
    needs:
      - translations
      - extract-versions

    env:
      MIX_ENV: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Download generated PO catalog
        uses: ./.github/actions/download-translations

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git libstdc++6 openssl libncurses6 locales ca-certificates libvips

      - name: Setup Elixir Project
        id: setup
        uses: ./.github/actions/elixir-setup
        with:
          elixir-version: ${{ needs.extract-versions.outputs.elixir }}
          otp-version: ${{ needs.extract-versions.outputs.otp }}

      # Install npm asset dependencies, including the Tailwind CLI
      - name: Install npm asset dependencies
        id: npm
        run: npm ci --prefix assets

      - name: Check for unused deps
        run: mix deps.unlock --check-unused
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}

      - name: Check Hex dependency licenses
        run: mix depscheck
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}

      - name: Check npm dependency licenses
        run: mix assets.licenses
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && steps.npm.outcome == 'success' }}

      - name: Check code formatting
        run: mix format --check-formatted
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}

      - name: Check for security vulnerabilities in Phoenix project
        run: mix sobelow --config
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}

      - name: Check Credo
        run: mix credo --strict
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}

      - name: Validate translation catalogs
        run: mix translations.check
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}

      # Extraction forces recompilation; keep its streaming output and run it
      # only after strict setup compilation and the cheaper checks have passed.
      - name: Check translation extraction
        run: mix gettext.extract --check-up-to-date

      - name: Restore core PLT cache
        id: core_plt_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          key: plt-core-v2-${{ runner.os }}-${{ runner.arch }}-${{ env.MIX_ENV }}-${{ steps.setup.outputs.otp-version }}-${{ steps.setup.outputs.elixir-version }}
          path: |
            _build/plts/core/*.plt
            _build/plts/core/*.plt.hash

      - name: Restore PLT cache
        id: plt_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          key: plt-v2-${{ runner.os }}-${{ runner.arch }}-${{ env.MIX_ENV }}-${{ steps.setup.outputs.otp-version }}-${{ steps.setup.outputs.elixir-version }}-${{ hashFiles('mix.exs', 'config/**/*.exs') }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            plt-v2-${{ runner.os }}-${{ runner.arch }}-${{ env.MIX_ENV }}-${{ steps.setup.outputs.otp-version }}-${{ steps.setup.outputs.elixir-version }}-${{ hashFiles('mix.exs', 'config/**/*.exs') }}-
          path: |
            _build/test/*.plt
            _build/test/*.plt.hash

      # Create PLTs if no cache was found
      - name: Create PLTs
        id: plt_create
        if: steps.plt_cache.outputs.cache-hit != 'true'
        run: mix dialyzer --plt

      # Preserve successfully built PLTs even if analysis later finds warnings.
      - name: Save core PLT cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        if: steps.core_plt_cache.outputs.cache-hit != 'true' && steps.plt_create.outcome == 'success'
        with:
          key: ${{ steps.core_plt_cache.outputs.cache-primary-key }}
          path: |
            _build/plts/core/*.plt
            _build/plts/core/*.plt.hash

      - name: Save PLT cache
        id: plt_cache_save
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        if: steps.plt_cache.outputs.cache-hit != 'true' && steps.plt_create.outcome == 'success'
        with:
          key: ${{ steps.plt_cache.outputs.cache-primary-key }}
          path: |
            _build/test/*.plt
            _build/test/*.plt.hash

      - name: Run dialyzer
        # Two formats are included for ease of debugging and it is lightly recommended to use both, see https://github.com/jeremyjh/dialyxir/issues/530 for reasoning
        # --format github is helpful to print the warnings in a way that GitHub understands and can place on the /files page of a PR
        # --format dialyxir allows the raw GitHub actions logs to be useful because they have the full warning printed
        run: mix dialyzer --format github --format dialyxir
