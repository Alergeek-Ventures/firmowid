name: Deploy production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  sentry-release:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/sentry-release.yml
    secrets: inherit

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: sentry-release
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Checkout AV secret service action
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          repository: Alergeek-Ventures/av-secret-service
          ssh-key: ${{ secrets.AV_SECRET_SERVICE_DEPLOY_KEY }}
          path: .av-secret-service
          ref: 98a6513f7b84def22025843c28fc7369ec1bb842

      - name: Deploy to Coolify
        uses: ./.av-secret-service/coolify-deploy
        with:
          infisical-identity-id: ${{ vars.INFISICAL_MACHINE_IDENTITY_ID }}
          infisical-project-slug: firmowid-z-hq-c
          coolify-token: ${{ secrets.COOLIFY_TOKEN }}
          coolify-app-uuid: ${{ vars.COOLIFY_APP_UUID }}
          print-logs: false
