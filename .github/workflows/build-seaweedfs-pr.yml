name: Build SeaweedFS S3 PR Image

on:
  workflow_dispatch:
    inputs:
      pr-number:
        description: Pull request number to build a SeaweedFS image for
        required: true
        type: number
      head-sha:
        description: Expected PR head SHA to build
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ inputs.pr-number }}-${{ inputs.head-sha }}
  cancel-in-progress: true

jobs:
  build-and-push-pr-image:
    name: Build and push SeaweedFS PR image
    runs-on: blacksmith-4vcpu-ubuntu-2404

    permissions:
      contents: read
      packages: write
      pull-requests: read

    steps:
      - name: Verify PR metadata
        id: pr
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr-number }}
          EXPECTED_SHA: ${{ inputs.head-sha }}
        run: |
          PR_JSON=$(curl --fail --silent --show-error \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")

          ACTUAL_SHA=$(printf '%s' "$PR_JSON" | python3 -c 'import json, sys; print(json.load(sys.stdin)["head"]["sha"])')
          HEAD_REPO=$(printf '%s' "$PR_JSON" | python3 -c 'import json, sys; print(json.load(sys.stdin)["head"]["repo"]["full_name"])')
          DRAFT=$(printf '%s' "$PR_JSON" | python3 -c 'import json, sys; print(str(json.load(sys.stdin)["draft"]).lower())')

          if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
            echo "Expected PR #$PR_NUMBER head SHA $EXPECTED_SHA, got $ACTUAL_SHA"
            echo "Re-run this workflow with the current PR head SHA."
            exit 1
          fi

          if [ "$DRAFT" = "true" ]; then
            echo "PR #$PR_NUMBER is draft; not publishing a PR image."
            exit 1
          fi

          FILES_JSON=$(curl --fail --silent --show-error \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files?per_page=100")

          if ! printf '%s' "$FILES_JSON" | grep '"filename": "deployment/Containerfile.seaweedfs"' >/dev/null; then
            echo "PR #$PR_NUMBER does not change deployment/Containerfile.seaweedfs."
            echo "No PR-specific SeaweedFS image is required."
            exit 1
          fi

          echo "head_repo=$HEAD_REPO" >> $GITHUB_OUTPUT

      - name: Checkout PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.pr.outputs.head_repo }}
          ref: ${{ inputs.head-sha }}
          persist-credentials: false

      - name: Verify checked out commit
        env:
          EXPECTED_SHA: ${{ inputs.head-sha }}
        run: |
          ACTUAL_SHA=$(git rev-parse HEAD)

          if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
            echo "Expected PR head SHA $EXPECTED_SHA, got $ACTUAL_SHA"
            exit 1
          fi

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - name: Build and push PR image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./deployment/Containerfile.seaweedfs
          push: true
          tags: |
            ghcr.io/alergeek-ventures/firmowid-new/seaweedfs-s3:pr-${{ inputs.pr-number }}-${{ inputs.head-sha }}
