name: Docker Build Check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "*"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  translations:
    name: Prepare translations
    uses: ./.github/workflows/translations-prepare.yml
    with:
      version: ${{ github.event.pull_request.head.sha || github.sha }}
    secrets:
      ACCENT_SNAPSHOT_API_KEY: ${{ secrets.ACCENT_SNAPSHOT_API_KEY }}
    permissions:
      contents: read

  docker-build:
    name: Verify Docker image builds successfully
    runs-on: ubuntu-latest
    needs: translations

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Download generated PO catalog
        uses: ./.github/actions/download-translations

      - name: Build image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: ./deployment/Containerfile.app
          push: false
          outputs: type=cacheonly
          build-args: |
            SOURCE_COMMIT=${{ github.event.pull_request.head.sha || github.sha }}
