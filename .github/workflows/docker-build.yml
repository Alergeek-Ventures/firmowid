name: Docker build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "*"

jobs:
  docker-build:
    name: Build docker image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract versions from .tool-versions
        id: versions
        run: |
          set -euo pipefail
          
          ELIXIR_FULL=$(grep "^elixir " .tool-versions | awk '{print $2}')
          ERLANG_REQUESTED=$(grep "^erlang " .tool-versions | awk '{print $2}')
          ELIXIR_VERSION=$(echo "$ELIXIR_FULL" | sed 's/-otp-.*//')
          
          echo "Detected from .tool-versions:"
          echo "  Elixir: $ELIXIR_VERSION"
          echo "  Erlang: $ERLANG_REQUESTED"
          
          # Query Docker Hub with retry logic and error handling
          MAX_RETRIES=3
          RETRY_DELAY=2
          
          for attempt in $(seq 1 $MAX_RETRIES); do
            echo "Attempt $attempt/$MAX_RETRIES: Querying Docker Hub API..."
            
            API_RESPONSE=$(curl -s --fail --max-time 10 \
              "https://hub.docker.com/v2/repositories/hexpm/elixir/tags?page_size=100&name=${ELIXIR_VERSION}-erlang-${ERLANG_REQUESTED}" \
              2>&1 || echo "CURL_FAILED")
            
            if [ "$API_RESPONSE" = "CURL_FAILED" ]; then
              echo "  curl failed (timeout or connection error)"
              if [ $attempt -lt $MAX_RETRIES ]; then
                echo "  Retrying in ${RETRY_DELAY}s..."
                sleep $RETRY_DELAY
                continue
              else
                echo "ERROR: Failed to reach Docker Hub API after $MAX_RETRIES attempts"
                exit 1
              fi
            fi
            
            # Validate JSON response
            if ! echo "$API_RESPONSE" | jq empty 2>/dev/null; then
              echo "  Invalid JSON response (likely rate limited or API error)"
              echo "  Response preview: ${API_RESPONSE:0:200}"
              if [ $attempt -lt $MAX_RETRIES ]; then
                echo "  Retrying in ${RETRY_DELAY}s..."
                sleep $RETRY_DELAY
                continue
              else
                echo "ERROR: Docker Hub API returned invalid JSON after $MAX_RETRIES attempts"
                exit 1
              fi
            fi
            
            # Parse tags from valid JSON
            TAGS=$(echo "$API_RESPONSE" | \
                   jq -r '.results[].name | select(contains("debian") and contains("slim"))' | \
                   sort -V -r | head -1)
            
            if [ -n "$TAGS" ]; then
              echo "  Successfully found matching image"
              break
            else
              echo "  No matching tags found in response"
              if [ $attempt -lt $MAX_RETRIES ]; then
                echo "  Retrying in ${RETRY_DELAY}s..."
                sleep $RETRY_DELAY
              fi
            fi
          done
          
          if [ -z "$TAGS" ]; then
            echo ""
            echo "ERROR: No matching image found for Elixir ${ELIXIR_VERSION} and Erlang ${ERLANG_REQUESTED}"
            echo ""
            echo "Checking available options with relaxed search..."
            curl -s --max-time 10 "https://hub.docker.com/v2/repositories/hexpm/elixir/tags?page_size=20&name=${ELIXIR_VERSION}-erlang" | \
              jq -r '.results[].name | select(contains("debian") and contains("slim"))' 2>/dev/null | head -10 || echo "  (Unable to fetch alternatives)"
            exit 1
          fi
          
          echo "Found matching image tag: $TAGS"
          
          OTP_VERSION=$(echo "$TAGS" | sed 's/.*erlang-\([0-9.]*\).*/\1/')
          DEBIAN_VERSION=$(echo "$TAGS" | sed 's/.*debian-\(.*\)/\1/')
          
          echo "elixir_version=$ELIXIR_VERSION" >> $GITHUB_OUTPUT
          echo "otp_version=$OTP_VERSION" >> $GITHUB_OUTPUT
          echo "debian_version=$DEBIAN_VERSION" >> $GITHUB_OUTPUT
          
          echo ""
          echo "Build args:"
          echo "  ELIXIR_VERSION=$ELIXIR_VERSION"
          echo "  OTP_VERSION=$OTP_VERSION"
          echo "  DEBIAN_VERSION=$DEBIAN_VERSION"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          build-args: |
            ELIXIR_VERSION=${{ steps.versions.outputs.elixir_version }}
            OTP_VERSION=${{ steps.versions.outputs.otp_version }}
            DEBIAN_VERSION=${{ steps.versions.outputs.debian_version }}
