name: Docker Build Check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "*"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  translations:
    name: Prepare translations
    uses: ./.github/workflows/translations-prepare.yml
    with:
      version: ${{ github.event.pull_request.head.sha || github.sha }}
    secrets:
      ACCENT_SNAPSHOT_API_KEY: ${{ secrets.ACCENT_SNAPSHOT_API_KEY }}
    permissions:
      contents: read

  docker-build:
    name: Verify Docker image builds successfully
    runs-on: ubuntu-latest
    needs: translations

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Download generated PO catalog
        uses: ./.github/actions/download-translations

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver: docker-container

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./deployment/Containerfile.app
          push: false
          outputs: type=cacheonly
          cache-from: type=gha,scope=firmowid-app
          # Optional cache export must not fail image validation; build failures remain fatal.
          cache-to: type=gha,scope=firmowid-app,mode=max,ignore-error=true
          build-args: |
            SOURCE_COMMIT=${{ github.event.pull_request.head.sha || github.sha }}
