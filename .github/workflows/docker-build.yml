name: Docker build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "*"

jobs:
  docker-build:
    name: Build docker image
    runs-on: ubuntu-latest

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
