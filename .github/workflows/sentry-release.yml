name: Sentry Release

on:
  workflow_call:
    inputs:
      catalog-version:
        description: Snapshot SHA already prepared in the calling workflow run
        required: false
        type: string
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sentry-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  translations:
    name: Prepare translations
    if: github.ref == 'refs/heads/main' && inputs.catalog-version == ''
    uses: ./.github/workflows/translations-prepare.yml
    with:
      version: ${{ github.sha }}
    secrets:
      ACCENT_API_KEY: ${{ secrets.ACCENT_API_KEY }}
      ACCENT_SNAPSHOT_API_KEY: ${{ github.ref == 'refs/heads/main' && github.actor != 'dependabot[bot]' && secrets.ACCENT_SNAPSHOT_API_KEY || '' }}

  extract-versions:
    name: Extract versions from .tool-versions
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      elixir: ${{ steps.versions.outputs.elixir }}
      otp: ${{ steps.versions.outputs.otp }}
      node: ${{ steps.versions.outputs.node }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Extract versions
        id: versions
        run: |
          ELIXIR_FULL=$(grep "^elixir " .tool-versions | awk '{print $2}')
          OTP=$(grep "^erlang " .tool-versions | awk '{print $2}')
          NODE=$(grep "^nodejs " .tool-versions | awk '{print $2}')
          ELIXIR=$(echo "$ELIXIR_FULL" | sed 's/-otp-.*//')

          echo "elixir=$ELIXIR" >> $GITHUB_OUTPUT
          echo "otp=$OTP" >> $GITHUB_OUTPUT
          echo "node=$NODE" >> $GITHUB_OUTPUT

  release:
    name: Create and finalize Sentry release
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && needs.extract-versions.result == 'success' && (inputs.catalog-version != '' || needs.translations.result == 'success') }}
    runs-on: ubuntu-latest
    environment: production
    needs:
      - translations
      - extract-versions
    env:
      MIX_ENV: prod

    steps:
      - name: Verify Sentry token
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          : "${SENTRY_AUTH_TOKEN:?SENTRY_AUTH_TOKEN must be configured in the production environment}"

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Download generated PO catalog
        uses: ./.github/actions/download-translations
        with:
          catalog-version: ${{ inputs.catalog-version || needs.translations.outputs.catalog-version }}

      - name: Setup Elixir project
        uses: ./.github/actions/elixir-setup
        with:
          elixir-version: ${{ needs.extract-versions.outputs.elixir }}
          otp-version: ${{ needs.extract-versions.outputs.otp }}

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ needs.extract-versions.outputs.node }}
          cache: npm
          cache-dependency-path: assets/package-lock.json

      # npm's postinstall patches deps/, so it has to run after the Elixir setup.
      # LiveView links assets/node_modules into the colocated hooks directory
      # only when it exists during a compile that is not a noop, hence --force.
      - name: Build production assets with sourcemaps
        run: |
          npm ci --prefix assets
          mix compile --force
          mix assets.sentry.deploy

      - name: Create and finalize Sentry release
        uses: getsentry/action-release@6fb9aeade7061441cf3864e34fbe11a1457ad7dc # v3
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG || 'alergeek' }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT || 'firmowid' }}
        with:
          environment: production
          release: ${{ github.sha }}
          sourcemaps: ./priv/static/assets
          url_prefix: ~/assets
          inject: false
