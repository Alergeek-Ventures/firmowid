name: Sentry Release

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  extract-versions:
    name: Extract versions from .tool-versions
    runs-on: self-hosted
    container:
      image: ghcr.io/alergeek-ventures/infrastructure/cicd-image:5b1d7150888c47322a6b5cda04796dfd1dbfb34c
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.github_token }}
    outputs:
      elixir: ${{ steps.versions.outputs.elixir }}
      otp: ${{ steps.versions.outputs.otp }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Extract versions
        id: versions
        run: |
          ELIXIR_FULL=$(grep "^elixir " .tool-versions | awk '{print $2}')
          OTP=$(grep "^erlang " .tool-versions | awk '{print $2}')
          ELIXIR=$(echo "$ELIXIR_FULL" | sed 's/-otp-.*//')

          echo "elixir=$ELIXIR" >> $GITHUB_OUTPUT
          echo "otp=$OTP" >> $GITHUB_OUTPUT

  release:
    name: Create and finalize Sentry release
    runs-on: self-hosted
    container:
      image: ghcr.io/alergeek-ventures/infrastructure/cicd-image:5b1d7150888c47322a6b5cda04796dfd1dbfb34c
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.github_token }}
    needs: extract-versions
    env:
      MIX_ENV: prod
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: ${{ vars.SENTRY_ORG || 'alergeek' }}
      SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT || 'firmowid' }}
      SENTRY_RELEASE: ${{ github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Setup Elixir project
        uses: ./.github/actions/elixir-setup
        with:
          elixir-version: ${{ needs.extract-versions.outputs.elixir }}
          otp-version: ${{ needs.extract-versions.outputs.otp }}

      - name: Build production assets with sourcemaps
        run: |
          mix tailwind.install --if-missing
          mix esbuild.install --if-missing
          mix tailwind firmowid --minify
          mix esbuild firmowid --minify --sourcemap=external
          mix phx.digest

      - name: Install sentry-cli
        run: curl -sL https://sentry.io/get-cli/ | bash

      - name: Validate Sentry configuration
        run: |
          for variable in SENTRY_AUTH_TOKEN SENTRY_ORG SENTRY_PROJECT SENTRY_RELEASE; do
            value=$(printenv "$variable")
            if [ -z "$value" ]; then
              echo "Missing required variable: $variable"
              exit 1
            fi
          done

      - name: Create Sentry release and upload sourcemaps
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          sentry-cli releases new "$SENTRY_RELEASE"
          sentry-cli releases set-commits "$SENTRY_RELEASE" --auto
          sentry-cli releases files "$SENTRY_RELEASE" upload-sourcemaps priv/static/assets --url-prefix "~/assets" --rewrite
          sentry-cli releases finalize "$SENTRY_RELEASE"

      - name: Verify release exists
        run: sentry-cli releases info "$SENTRY_RELEASE"
