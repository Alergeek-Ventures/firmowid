name: Sentry Release

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  extract-versions:
    name: Extract versions from .tool-versions
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      elixir: ${{ steps.versions.outputs.elixir }}
      otp: ${{ steps.versions.outputs.otp }}
      node: ${{ steps.versions.outputs.node }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Extract versions
        id: versions
        run: |
          ELIXIR_FULL=$(grep "^elixir " .tool-versions | awk '{print $2}')
          OTP=$(grep "^erlang " .tool-versions | awk '{print $2}')
          NODE=$(grep "^nodejs " .tool-versions | awk '{print $2}')
          ELIXIR=$(echo "$ELIXIR_FULL" | sed 's/-otp-.*//')

          echo "elixir=$ELIXIR" >> $GITHUB_OUTPUT
          echo "otp=$OTP" >> $GITHUB_OUTPUT
          echo "node=$NODE" >> $GITHUB_OUTPUT

  release:
    name: Create and finalize Sentry release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    needs: extract-versions
    env:
      MIX_ENV: prod

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git libstdc++6 openssl libncurses6 locales ca-certificates libvips chromium

      - name: Setup Elixir project
        uses: ./.github/actions/elixir-setup
        with:
          elixir-version: ${{ needs.extract-versions.outputs.elixir }}
          otp-version: ${{ needs.extract-versions.outputs.otp }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ needs.extract-versions.outputs.node }}
          cache: npm
          cache-dependency-path: assets/package-lock.json

      - name: Build production assets with sourcemaps
        run: |
          npm ci --prefix assets
          mix esbuild.install --if-missing
          mix assets.sentry.deploy

      - name: Create and finalize Sentry release
        uses: getsentry/action-release@ff07929a6537bac57790c3451cf4d364aca38528 # v3
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG || 'alergeek' }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT || 'firmowid' }}
        with:
          environment: production
          release: ${{ github.sha }}
          sourcemaps: ./priv/static/assets
          url_prefix: ~/assets
          inject: false
