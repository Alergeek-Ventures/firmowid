name: Sentry Release

on:
  workflow_call:
    inputs:
      catalog-version:
        description: Snapshot SHA already prepared in the calling workflow run
        required: false
        type: string
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sentry-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  translations:
    name: Prepare translations
    if: github.ref == 'refs/heads/main' && inputs.catalog-version == ''
    uses: ./.github/workflows/translations-prepare.yml
    with:
      version: ${{ github.sha }}
    secrets:
      ACCENT_API_KEY: ${{ secrets.ACCENT_API_KEY }}

  # The build needs devenv, so it runs on selenge, without the production environment:
  # selenge runners share a kernel with pull request jobs, so the Sentry token stays off them.
  assets:
    name: Build production assets with sourcemaps
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && (inputs.catalog-version != '' || needs.translations.result == 'success') }}
    runs-on: selenge
    needs:
      - translations
    env:
      MIX_ENV: prod

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Download generated PO catalog
        uses: ./.github/actions/download-translations
        with:
          catalog-version: ${{ inputs.catalog-version || needs.translations.outputs.catalog-version }}

      - name: Setup Elixir project
        uses: ./.github/actions/elixir-setup

      # npm's postinstall patches deps/, so it has to run after the Elixir setup.
      # LiveView links assets/node_modules into the colocated hooks directory
      # only when it exists during a compile that is not a noop, hence --force.
      - name: Build production assets with sourcemaps
        run: |
          npm ci --prefix assets
          mix compile --force
          mix assets.sentry.deploy

      - name: Upload production assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sentry-assets-${{ github.sha }}
          path: priv/static/assets
          if-no-files-found: error
          retention-days: 1

  release:
    name: Create and finalize Sentry release
    # A skipped translations job would skip this job through the default success() check.
    if: ${{ !cancelled() && needs.assets.result == 'success' }}
    runs-on: ubuntu-latest
    environment: production
    needs:
      - assets

    steps:
      - name: Verify Sentry token
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          : "${SENTRY_AUTH_TOKEN:?SENTRY_AUTH_TOKEN must be configured in the production environment}"

      # The release action associates commits from the local history.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Download production assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: sentry-assets-${{ github.sha }}
          path: priv/static/assets

      - name: Create and finalize Sentry release
        uses: getsentry/action-release@2e505a70ff06dac263413242aa3617fec90134e5 # v3.9.1
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG || 'alergeek' }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT || 'firmowid' }}
        with:
          environment: production
          release: ${{ github.sha }}
          sourcemaps: ./priv/static/assets
          url_prefix: ~/assets
          inject: false
