name: Version Sync Check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "*"

jobs:
  version-sync:
    name: Validate image and tool versions are in sync
    runs-on: self-hosted
    container:
      image: ghcr.io/alergeek-ventures/infrastructure/cicd-image:5b1d7150888c47322a6b5cda04796dfd1dbfb34c
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.github_token }}
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      # ── Elixir / Erlang: .tool-versions ↔ Containerfile.app ────────
      - name: Compare Elixir/Erlang versions
        run: |
          TOOL_ELIXIR_FULL=$(grep "^elixir " .tool-versions | awk '{print $2}')
          TOOL_ERLANG=$(grep "^erlang " .tool-versions | awk '{print $2}')
          TOOL_ELIXIR=$(echo "$TOOL_ELIXIR_FULL" | sed 's/-otp-.*//')

          # Strip the @sha256:... digest before parsing version components
          BUILDER_IMAGE=$(grep '^ARG BUILDER_IMAGE=' deployment/Containerfile.app | sed 's/.*hexpm\/elixir:\([^"@]*\).*/\1/')
          DOCKERFILE_ELIXIR=$(echo "$BUILDER_IMAGE" | sed 's/-erlang.*//')
          DOCKERFILE_ERLANG=$(echo "$BUILDER_IMAGE" | sed 's/.*erlang-\([0-9.]*\)-.*/\1/')

          echo "=== Elixir / Erlang ==="
          echo ""
          echo "From .tool-versions:"
          echo "  Elixir: $TOOL_ELIXIR"
          echo "  Erlang: $TOOL_ERLANG"
          echo "From Containerfile.app:"
          echo "  Elixir: $DOCKERFILE_ELIXIR"
          echo "  Erlang: $DOCKERFILE_ERLANG"
          echo ""

          MISMATCH=0

          if [ "$TOOL_ELIXIR" != "$DOCKERFILE_ELIXIR" ]; then
            echo "❌ Elixir version mismatch!"
            echo "   .tool-versions: $TOOL_ELIXIR"
            echo "   Containerfile:  $DOCKERFILE_ELIXIR"
            MISMATCH=1
          else
            echo "✅ Elixir version matches: $TOOL_ELIXIR"
          fi

          if [ "$TOOL_ERLANG" != "$DOCKERFILE_ERLANG" ]; then
            echo "❌ Erlang version mismatch!"
            echo "   .tool-versions: $TOOL_ERLANG"
            echo "   Containerfile:  $DOCKERFILE_ERLANG"
            MISMATCH=1
          else
            echo "✅ Erlang version matches: $TOOL_ERLANG"
          fi

          if [ $MISMATCH -eq 1 ]; then
            echo ""
            echo "Please update deployment/Containerfile.app to match .tool-versions:"
            echo "1. Query Docker Hub for matching image:"
            echo "   curl -s \"https://hub.docker.com/v2/repositories/hexpm/elixir/tags?page_size=100&name=${TOOL_ELIXIR}-erlang-${TOOL_ERLANG}\" | jq -r '.results[].name | select(contains(\"alpine\"))' | sort -V -r | head -5"
            echo "2. Update BUILDER_IMAGE in deployment/Containerfile.app"
            exit 1
          fi

          echo ""
          echo "✅ Elixir/Erlang versions in sync"

      # ── ParadeDB: compose.yml (source of truth) ↔ CI workflow ──────
      - name: Compare ParadeDB image across compose and CI
        run: |
          echo "=== ParadeDB ==="
          echo ""

          # Extract full image ref (tag@sha256:digest) from each file
          COMPOSE_PARADEDB=$(grep 'image:.*paradedb/paradedb' local/compose.yml | sed 's/.*image: *//')
          CI_PARADEDB=$(grep 'image:.*paradedb/paradedb' .github/workflows/elixir-build-and-test.yml | sed 's/.*image: *//')

          echo "  compose.yml:             $COMPOSE_PARADEDB"
          echo "  elixir-build-and-test:   $CI_PARADEDB"

          if [ "$COMPOSE_PARADEDB" != "$CI_PARADEDB" ]; then
            echo ""
            echo "❌ ParadeDB image mismatch!"
            echo "   Source of truth (local/compose.yml): $COMPOSE_PARADEDB"
            echo "   Out of sync (.github/workflows/elixir-build-and-test.yml): $CI_PARADEDB"
            echo ""
            echo "Please update the service image in elixir-build-and-test.yml to match compose.yml."
            exit 1
          fi

          echo "✅ ParadeDB image in sync"

      # ── SeaweedFS: compose.yml (source of truth) ↔ Containerfile ───
      - name: Compare SeaweedFS image across compose and Containerfile
        run: |
          echo "=== SeaweedFS ==="
          echo ""

          # Extract the image ref after "image:" or "FROM"
          COMPOSE_SEAWEEDFS=$(grep 'image:.*seaweedfs' local/compose.yml | sed 's/.*image: *//')
          CONTAINERFILE_SEAWEEDFS=$(grep '^FROM.*seaweedfs' deployment/Containerfile.seaweedfs | sed 's/^FROM *//')

          echo "  compose.yml:               $COMPOSE_SEAWEEDFS"
          echo "  Containerfile.seaweedfs:   $CONTAINERFILE_SEAWEEDFS"

          if [ "$COMPOSE_SEAWEEDFS" != "$CONTAINERFILE_SEAWEEDFS" ]; then
            echo ""
            echo "❌ SeaweedFS image mismatch!"
            echo "   Source of truth (local/compose.yml): $COMPOSE_SEAWEEDFS"
            echo "   Out of sync (deployment/Containerfile.seaweedfs): $CONTAINERFILE_SEAWEEDFS"
            echo ""
            echo "Please update the FROM line in Containerfile.seaweedfs to match compose.yml."
            exit 1
          fi

          echo "✅ SeaweedFS image in sync"
