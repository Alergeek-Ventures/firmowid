name: Version Sync Check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "*"

jobs:
  version-sync:
    name: Validate image and tool versions are in sync
    runs-on: self-hosted
    container:
      image: ghcr.io/alergeek-ventures/infrastructure/cicd-image:5b1d7150888c47322a6b5cda04796dfd1dbfb34c
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.github_token }}
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # ── Elixir / Erlang: .tool-versions ↔ Containerfile.app ────────
      - name: Compare Elixir/Erlang versions
        run: |
          TOOL_ELIXIR_FULL=$(grep "^elixir " .tool-versions | awk '{print $2}')
          TOOL_ERLANG=$(grep "^erlang " .tool-versions | awk '{print $2}')
          TOOL_ELIXIR=$(echo "$TOOL_ELIXIR_FULL" | sed 's/-otp-.*//')

          # Strip the @sha256:... digest before parsing version components
          BUILDER_IMAGE=$(grep '^ARG BUILDER_IMAGE=' deployment/Containerfile.app | sed 's/.*hexpm\/elixir:\([^"@]*\).*/\1/')
          DOCKERFILE_ELIXIR=$(echo "$BUILDER_IMAGE" | sed 's/-erlang.*//')
          DOCKERFILE_ERLANG=$(echo "$BUILDER_IMAGE" | sed 's/.*erlang-\([0-9.]*\)-.*/\1/')

          echo "=== Elixir / Erlang ==="
          echo ""
          echo "From .tool-versions:"
          echo "  Elixir: $TOOL_ELIXIR"
          echo "  Erlang: $TOOL_ERLANG"
          echo "From Containerfile.app:"
          echo "  Elixir: $DOCKERFILE_ELIXIR"
          echo "  Erlang: $DOCKERFILE_ERLANG"
          echo ""

          MISMATCH=0

          if [ "$TOOL_ELIXIR" != "$DOCKERFILE_ELIXIR" ]; then
            echo "❌ Elixir version mismatch!"
            echo "   .tool-versions: $TOOL_ELIXIR"
            echo "   Containerfile:  $DOCKERFILE_ELIXIR"
            MISMATCH=1
          else
            echo "✅ Elixir version matches: $TOOL_ELIXIR"
          fi

          if [ "$TOOL_ERLANG" != "$DOCKERFILE_ERLANG" ]; then
            echo "❌ Erlang version mismatch!"
            echo "   .tool-versions: $TOOL_ERLANG"
            echo "   Containerfile:  $DOCKERFILE_ERLANG"
            MISMATCH=1
          else
            echo "✅ Erlang version matches: $TOOL_ERLANG"
          fi

          if [ $MISMATCH -eq 1 ]; then
            echo ""
            echo "Please update deployment/Containerfile.app to match .tool-versions:"
            echo "1. Query Docker Hub for matching image:"
            echo "   curl -s \"https://hub.docker.com/v2/repositories/hexpm/elixir/tags?page_size=100&name=${TOOL_ELIXIR}-erlang-${TOOL_ERLANG}\" | jq -r '.results[].name | select(contains(\"alpine\"))' | sort -V -r | head -5"
            echo "2. Update BUILDER_IMAGE in deployment/Containerfile.app"
            exit 1
          fi

          echo ""
          echo "✅ Elixir/Erlang versions in sync"

      # ── ParadeDB: compose.yml owns the image, CI derives from it ───
      - name: Validate ParadeDB image ownership
        run: |
          echo "=== ParadeDB ==="
          echo ""

          COMPOSE_PARADEDB=$(grep 'image:.*paradedb/paradedb' local/compose.yml | sed 's/.*image: *//')
          CI_HARDCODED_PARADEDB=$(grep -E '^[[:space:]]*image:[[:space:]]*.*paradedb/paradedb' .github/workflows/elixir-build-and-test.yml || true)
          CI_DERIVED_PARADEDB=$(grep -E '^[[:space:]]*image:[[:space:]]*.*needs\.extract-versions\.outputs\.paradedb_image' .github/workflows/elixir-build-and-test.yml || true)

          echo "  owner (local/compose.yml): $COMPOSE_PARADEDB"

          if [ -z "$COMPOSE_PARADEDB" ]; then
            echo ""
            echo "❌ ParadeDB image owner missing!"
            echo "   Expected local/compose.yml to contain the pinned paradedb/paradedb image."
            echo ""
            echo "Dependabot should update local/compose.yml; CI derives the service image from it."
            exit 1
          fi

          if [ -n "$CI_HARDCODED_PARADEDB" ]; then
            echo ""
            echo "❌ ParadeDB image duplicated in CI!"
            echo "   local/compose.yml is the owner. CI must use needs.extract-versions.outputs.paradedb_image."
            echo ""
            echo "$CI_HARDCODED_PARADEDB"
            exit 1
          fi

          if [ -z "$CI_DERIVED_PARADEDB" ]; then
            echo ""
            echo "❌ ParadeDB image is not derived in CI!"
            echo "   Expected elixir-build-and-test.yml services.db.image to use:"
            printf '%s%s\n' '   $' '{{ needs.extract-versions.outputs.paradedb_image }}'
            exit 1
          fi

          echo "✅ ParadeDB image ownership is correct"

      # ── SeaweedFS: Containerfile owns the upstream image ───────────
      - name: Validate SeaweedFS image ownership
        run: |
          echo "=== SeaweedFS ==="
          echo ""

          COMPOSE_SEAWEEDFS=$(grep -E '^[[:space:]]*image:[[:space:]]*.*chrislusf/seaweedfs' local/compose.yml || true)
          CONTAINERFILE_SEAWEEDFS=$(grep '^FROM.*seaweedfs' deployment/Containerfile.seaweedfs | sed 's/^FROM *//')
          CI_LATEST_SEAWEEDFS=$(grep 'seaweedfs-s3:latest' \
            .github/workflows/build-seaweedfs.yml \
            .github/workflows/build-seaweedfs-pr.yml \
            .github/workflows/elixir-build-and-test.yml || true)
          CI_MAIN_SEAWEEDFS=$(grep 'seaweedfs-s3:main' .github/workflows/build-seaweedfs.yml || true)
          CI_SHA_SEAWEEDFS=$(grep 'seaweedfs-s3:sha-' .github/workflows/build-seaweedfs.yml || true)
          CI_DERIVED_SEAWEEDFS=$(grep -E '^[[:space:]]*image:[[:space:]]*.*needs\.extract-versions\.outputs\.seaweedfs_image' .github/workflows/elixir-build-and-test.yml || true)

          echo "  owner (Containerfile.seaweedfs): $CONTAINERFILE_SEAWEEDFS"

          if [ -n "$COMPOSE_SEAWEEDFS" ]; then
            echo ""
            echo "❌ SeaweedFS upstream image duplicated in compose!"
            echo "   deployment/Containerfile.seaweedfs owns the upstream chrislusf/seaweedfs ref."
            echo ""
            echo "$COMPOSE_SEAWEEDFS"
            exit 1
          fi

          if [ -z "$CONTAINERFILE_SEAWEEDFS" ]; then
            echo ""
            echo "❌ SeaweedFS owner missing!"
            echo "   Expected deployment/Containerfile.seaweedfs to contain the upstream FROM image."
            exit 1
          fi

          if [ -n "$CI_LATEST_SEAWEEDFS" ]; then
            echo ""
            echo "❌ SeaweedFS CI still references the floating latest tag!"
            echo "   Use a version/main tag for current main or a pr-<number>-<sha> tag for PR wrapper changes."
            echo ""
            echo "$CI_LATEST_SEAWEEDFS"
            exit 1
          fi

          if [ -z "$CI_MAIN_SEAWEEDFS" ] || [ -z "$CI_SHA_SEAWEEDFS" ]; then
            echo ""
            echo "❌ SeaweedFS main publisher tags are incomplete!"
            echo "   build-seaweedfs.yml should publish :main and :sha-<github.sha>."
            exit 1
          fi

          if [ -z "$CI_DERIVED_SEAWEEDFS" ]; then
            echo ""
            echo "❌ SeaweedFS image is not derived in Build/Test!"
            echo "   Expected elixir-build-and-test.yml services.seaweedfs.image to use needs.extract-versions.outputs.seaweedfs_image."
            exit 1
          fi

          echo "✅ SeaweedFS image ownership is correct"
