name: OpenSSF Scorecard

on:
  # Main gets merges every few minutes, so score it weekly instead of per push.
  # Scorecard analyses only the default branch.
  schedule:
    - cron: "30 1 * * 6"
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    # Scorecard's API accepts published results only from GitHub-hosted Ubuntu runners:
    # https://github.com/ossf/scorecard-action#workflow-restrictions
    runs-on: ubuntu-latest
    permissions:
      # Upload to code scanning; only people with write access see the alerts.
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          # Not on scorecard.dev or the badge API until the score is worth showing.
          publish_results: false

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: results.sarif
