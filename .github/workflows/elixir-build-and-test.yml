name: Build and Test
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "*"
  workflow_dispatch:
    inputs:
      coverage-benchmark:
        description: Run isolated coverage/no-coverage ABBA benchmark (branch only)
        type: boolean
        default: false
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}${{ github.event_name == 'workflow_dispatch' && inputs.coverage-benchmark && '-coverage-benchmark' || '' }}
  cancel-in-progress: true

jobs:
  translations:
    name: Prepare translations
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.coverage-benchmark) }}
    uses: ./.github/workflows/translations-prepare.yml
    with:
      version: ${{ github.event.pull_request.head.sha || github.sha }}
    secrets:
      ACCENT_API_KEY: ${{ secrets.ACCENT_API_KEY }}
      ACCENT_SNAPSHOT_API_KEY: ${{ github.ref == 'refs/heads/main' && github.actor != 'dependabot[bot]' && secrets.ACCENT_SNAPSHOT_API_KEY || '' }}
    permissions:
      contents: read

  benchmark-translations:
    name: Export existing main HEAD catalog (read only)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.coverage-benchmark }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      catalog-version: ${{ steps.catalog.outputs.version }}
    steps:
      - name: Reject benchmark on main before credentials
        run: |
          if [[ "$GITHUB_REF" != refs/heads/* || "$GITHUB_REF" == 'refs/heads/main' ]]; then
            echo 'Coverage benchmarks must run on a non-main branch.' >&2
            exit 1
          fi

      - name: Checkout exact benchmark commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Accent CLI
        uses: ./.github/actions/setup-accent

      - name: Resolve existing main HEAD snapshot once
        id: catalog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          main_sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          [[ "$main_sha" =~ ^[0-9a-f]{40}$ ]]
          echo "version=$main_sha" >> "$GITHUB_OUTPUT"

      - name: Export exact existing snapshot without fallback or creation
        env:
          ACCENT_API_KEY: ${{ secrets.ACCENT_API_KEY }}
          ACCENT_VERSION: ${{ steps.catalog.outputs.version }}
        run: |
          set -euo pipefail
          elixir scripts/accent.exs export --version "$ACCENT_VERSION"
          test "$(head -n 1 priv/gettext/pl/LC_MESSAGES/default.po)" = "# Accent version: $ACCENT_VERSION"

      - name: Upload benchmark PO catalog
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: accent-po-${{ github.sha }}
          path: priv/gettext/pl/LC_MESSAGES/default.po
          if-no-files-found: error

  secret-scan:
    name: Scan repository for secrets
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Scan repository with Betterleaks
        uses: docker://ghcr.io/betterleaks/betterleaks@sha256:8b9d12db5e11ca798029da44923503de5d8cfff6992cffaaa6722fbeb9fc7797 # v1.8.1
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: safe.directory
          GIT_CONFIG_VALUE_0: /github/workspace
        with:
          args: git . --validation=false --redact --no-banner --no-color

  extract-versions:
    name: Extract versions and service images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      pull-requests: read
    outputs:
      elixir: ${{ steps.versions.outputs.elixir }}
      otp: ${{ steps.versions.outputs.otp }}
      paradedb_image: ${{ steps.images.outputs.paradedb_image }}
      seaweedfs_image: ${{ steps.images.outputs.seaweedfs_image }}
      seaweedfs_pr_image_required: ${{ steps.images.outputs.seaweedfs_pr_image_required }}
      seaweedfs_pr_number: ${{ steps.images.outputs.seaweedfs_pr_number }}
      seaweedfs_pr_head_sha: ${{ steps.images.outputs.seaweedfs_pr_head_sha }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Extract versions
        id: versions
        run: |
          ELIXIR_FULL=$(grep "^elixir " .tool-versions | awk '{print $2}')
          OTP=$(grep "^erlang " .tool-versions | awk '{print $2}')
          ELIXIR=$(echo "$ELIXIR_FULL" | sed 's/-otp-.*//')
          echo "elixir=$ELIXIR" >> $GITHUB_OUTPUT
          echo "otp=$OTP" >> $GITHUB_OUTPUT
          echo "Detected from .tool-versions:"
          echo "  Elixir: $ELIXIR"
          echo "  OTP: $OTP"

      - name: Extract service images
        id: images
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          PARADEDB_IMAGE=$(grep 'image:.*paradedb/paradedb' local/compose.yml | sed 's/.*image: *//')
          SEAWEEDFS_VERSION=$(grep '^FROM' deployment/Containerfile.seaweedfs | sed 's/.*seaweedfs://' | sed 's/@.*//')
          SEAWEEDFS_IMAGE="ghcr.io/alergeek-ventures/firmowid-new/seaweedfs-s3:${SEAWEEDFS_VERSION}"
          SEAWEEDFS_PR_IMAGE_REQUIRED="false"

          if [ "$EVENT_NAME" = "pull_request" ]; then
            PR_FILES_URL="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files?per_page=100"

            if curl --fail --silent --show-error \
              --header "Authorization: Bearer $GITHUB_TOKEN" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "$PR_FILES_URL" | grep '"filename": "deployment/Containerfile.seaweedfs"' >/dev/null; then
              SEAWEEDFS_IMAGE="ghcr.io/alergeek-ventures/firmowid-new/seaweedfs-s3:pr-${PR_NUMBER}-${PR_HEAD_SHA}"
              SEAWEEDFS_PR_IMAGE_REQUIRED="true"
            fi
          fi

          echo "paradedb_image=$PARADEDB_IMAGE" >> $GITHUB_OUTPUT
          echo "seaweedfs_image=$SEAWEEDFS_IMAGE" >> $GITHUB_OUTPUT
          echo "seaweedfs_pr_image_required=$SEAWEEDFS_PR_IMAGE_REQUIRED" >> $GITHUB_OUTPUT
          echo "seaweedfs_pr_number=$PR_NUMBER" >> $GITHUB_OUTPUT
          echo "seaweedfs_pr_head_sha=$PR_HEAD_SHA" >> $GITHUB_OUTPUT
          echo "Detected from local/compose.yml:"
          echo "  ParadeDB: $PARADEDB_IMAGE"
          echo "Selected SeaweedFS image:"
          echo "  SeaweedFS: $SEAWEEDFS_IMAGE"

      - name: Log in to GHCR
        run: |
          printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify SeaweedFS image exists
        env:
          SEAWEEDFS_IMAGE: ${{ steps.images.outputs.seaweedfs_image }}
          SEAWEEDFS_PR_IMAGE_REQUIRED: ${{ steps.images.outputs.seaweedfs_pr_image_required }}
          SEAWEEDFS_PR_NUMBER: ${{ steps.images.outputs.seaweedfs_pr_number }}
          SEAWEEDFS_PR_HEAD_SHA: ${{ steps.images.outputs.seaweedfs_pr_head_sha }}
        run: |
          if docker manifest inspect "$SEAWEEDFS_IMAGE" >/dev/null 2>&1; then
            echo "✅ SeaweedFS image is available: $SEAWEEDFS_IMAGE"
            exit 0
          fi

          echo "❌ SeaweedFS image is not available: $SEAWEEDFS_IMAGE"
          echo ""

          if [ "$SEAWEEDFS_PR_IMAGE_REQUIRED" = "true" ]; then
            echo "This PR changes deployment/Containerfile.seaweedfs, so Build/Test requires a PR-scoped SeaweedFS image."
            echo ""
            echo "Publish it from your machine with GitHub CLI:"
            echo ""
            echo "  gh workflow run \"Build SeaweedFS S3 PR Image\" --ref main -f pr-number=$SEAWEEDFS_PR_NUMBER -f head-sha=$SEAWEEDFS_PR_HEAD_SHA"
            echo ""
            echo "Expected tag:"
            echo ""
            echo "  $SEAWEEDFS_IMAGE"
            echo ""
            echo "After the publisher workflow succeeds, rerun this Build and Test workflow."
          else
            echo "Build/Test expected the main SeaweedFS image tag to already exist."
            echo "Run the main publisher workflow or check GHCR package availability."
            echo ""
            echo "Expected tag:"
            echo ""
            echo "  $SEAWEEDFS_IMAGE"
          fi

          exit 1

  build:
    name: ${{ github.event_name == 'workflow_dispatch' && inputs.coverage-benchmark && 'Coverage ABBA benchmark' || 'Build and test' }}
    # One shared runner/setup/service definition keeps both benchmark arms identical.
    if: >-
      ${{ !cancelled() && needs.extract-versions.result == 'success' &&
          (needs.translations.result == 'success' || needs.benchmark-translations.result == 'success') }}

    runs-on: ubuntu-latest
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && inputs.coverage-benchmark && 120 || 360 }}

    needs:
      - translations
      - benchmark-translations
      - extract-versions
    permissions:
      contents: read
      packages: read

    env:
      MIX_ENV: test
      KSEF_ENV: test

      # Database configuration (matches config/test.exs)
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: localhost

      # S3 / SeaweedFS configuration (matches config/test.exs)
      S3_HOST: localhost
      S3_SCHEME: "http://"
      S3_BUCKET: firmowid-uploads
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1

    services:
      db:
        image: ${{ needs.extract-versions.outputs.paradedb_image }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: firmowid_test
        options: >-
          --health-cmd "pg_isready -U postgres -d firmowid_test" --health-interval 2s
          --health-timeout 5s --health-retries 30
        ports:
          - 5432:5432

      seaweedfs:
        image: ${{ needs.extract-versions.outputs.seaweedfs_image }}
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.github_token }}
        env:
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
        ports:
          - 8333:8333

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Download generated PO catalog
        uses: ./.github/actions/download-translations
        with:
          catalog-version: ${{ needs.translations.outputs.catalog-version || needs.benchmark-translations.outputs.catalog-version }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git libstdc++6 openssl libncurses6 locales ca-certificates libvips

      - name: Generate isolated test keys
        run: |
          secret_key_base="$(openssl rand -base64 48)"
          cloak_vault_key="$(openssl rand -base64 32)"
          printf '%s\n' "SECRET_KEY_BASE=$secret_key_base" "CLOAK_VAULT_KEY=$cloak_vault_key" >> "$GITHUB_ENV"

      - name: Setup Elixir Project
        id: setup
        uses: ./.github/actions/elixir-setup
        with:
          elixir-version: ${{ needs.extract-versions.outputs.elixir }}
          otp-version: ${{ needs.extract-versions.outputs.otp }}
          cache-key: ${{ github.event_name == 'workflow_dispatch' && inputs.coverage-benchmark && format('coverage-benchmark-{0}-{1}', github.run_id, github.run_attempt) || 'v2' }}

      - name: Create and migrate database
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.coverage-benchmark) }}
        run: mix ash.setup

      - name: Run tests with LCOV coverage report
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.coverage-benchmark) }}
        id: tests
        run: |
          set -o pipefail
          mix coveralls.lcov --slowest 20 2>&1 | tee coveralls.log

      - name: Run paired coverage benchmark on this runner
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.coverage-benchmark }}
        env:
          BENCHMARK_CATALOG_SHA: ${{ needs.benchmark-translations.outputs.catalog-version }}
          BENCHMARK_OTP: ${{ steps.setup.outputs.otp-version }}
          BENCHMARK_ELIXIR: ${{ steps.setup.outputs.elixir-version }}
          BENCHMARK_DB_CONTAINER: ${{ job.services.db.id }}
          BENCHMARK_S3_CONTAINER: ${{ job.services.seaweedfs.id }}
          BENCHMARK_DB_IMAGE: ${{ needs.extract-versions.outputs.paradedb_image }}
          BENCHMARK_S3_IMAGE: ${{ needs.extract-versions.outputs.seaweedfs_image }}
          BENCHMARK_CACHE_KEY: coverage-benchmark-${{ github.run_id }}-${{ github.run_attempt }}
        run: bash scripts/ci-coverage-benchmark.sh

      - name: Upload benchmark evidence even on failure
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.coverage-benchmark }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-benchmark-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/coverage-benchmark/
          if-no-files-found: warn

      - name: Upload test log
        if: ${{ always() && (steps.tests.outcome == 'success' || steps.tests.outcome == 'failure') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: excoveralls-test-log
          path: coveralls.log
          if-no-files-found: warn

      - name: Upload coverage LCOV report
        if: ${{ always() && (steps.tests.outcome == 'success' || steps.tests.outcome == 'failure') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: excoveralls-lcov-report
          path: cover/lcov.info
          if-no-files-found: ${{ steps.tests.outcome == 'success' && 'error' || 'warn' }}

  coverage-report:
    name: Publish coverage summary and PR comment
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.coverage-benchmark) }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      actions: read
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download coverage LCOV report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: excoveralls-lcov-report
          path: cover

      - name: Publish coverage summary and PR comment
        uses: k1LoW/octocov-action@a167dc0dee441b7ffc45e1b862ab55ec0d87f278 # v1
        with:
          config: .octocov.yml
