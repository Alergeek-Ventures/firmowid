name: Build and Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "*"

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    env:
      MIX_ENV: test
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5433/firmowid?sslmode=prefer"
      SECRET_KEY_BASE: "REMOVED_PHOENIX_SECRET_KEY_BASE"

    strategy:
      matrix:
        elixir: ["1.18.4"]
        otp: ["28.0.1"]

    services:
      db:
        image: paradedb/paradedb:latest
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: firmowid
        ports: ["5433:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      s3-emulator:
        image: localstack/localstack:latest
        env:
          SERVICES: s3
          AWS_DEFAULT_REGION: us-east-1
        ports: ["4566:4566"]

    steps:
      - name: Set up temporary directory
        run: |
          TEMP_DIR="$RUNNER_TEMP/localstack-init"
          mkdir -p "$TEMP_DIR"
          echo "TEMP_DIR=$TEMP_DIR" >> $GITHUB_ENV

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Copy files to temporary directory
        run: |
          cp -r ./local/s3-init/* "$RUNNER_TEMP/localstack-init/"

      - name: Stop and restart LocalStack with volume
        run: |
          CONTAINER_ID=$(docker ps --filter "ancestor=localstack/localstack" --format "{{.ID}}")
          docker stop "$CONTAINER_ID"
          docker rm "$CONTAINER_ID"
          docker run -d --name s3-emulator \
            -p 4566:4566 \
            -e SERVICES=s3 \
            -e AWS_DEFAULT_REGION=us-east-1 \
            -v "$RUNNER_TEMP/localstack-init:/etc/localstack/init/ready.d" \
            localstack/localstack:latest

      - name: Setup Elixir Project
        uses: ./.github/actions/elixir-setup
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      - name: Run Migrations
        run: mix ecto.migrate

      - name: Run Tests
        run: mix test
