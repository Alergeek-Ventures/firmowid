name: Build and Test
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "*"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  extract-versions:
    name: Extract versions from .tool-versions
    runs-on: self-hosted
    container:
      image: ghcr.io/alergeek-ventures/infrastructure/cicd-image:5b1d7150888c47322a6b5cda04796dfd1dbfb34c
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.github_token }}
    outputs:
      elixir: ${{ steps.versions.outputs.elixir }}
      otp: ${{ steps.versions.outputs.otp }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract versions
        id: versions
        run: |
          ELIXIR_FULL=$(grep "^elixir " .tool-versions | awk '{print $2}')
          OTP=$(grep "^erlang " .tool-versions | awk '{print $2}')
          ELIXIR=$(echo "$ELIXIR_FULL" | sed 's/-otp-.*//')
          echo "elixir=$ELIXIR" >> $GITHUB_OUTPUT
          echo "otp=$OTP" >> $GITHUB_OUTPUT
          echo "Detected from .tool-versions:"
          echo "  Elixir: $ELIXIR"
          echo "  OTP: $OTP"

  build:
    name: Build and test

    # required for self-hosted runners
    runs-on: self-hosted
    container:
      image: ghcr.io/alergeek-ventures/infrastructure/cicd-image:5b1d7150888c47322a6b5cda04796dfd1dbfb34c
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.github_token }}
    # end

    needs: extract-versions
    env:
      MIX_ENV: test
      
      # Database configuration (matches config/test.exs)
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      
      SECRET_KEY_BASE: "REMOVED_PHOENIX_SECRET_KEY_BASE"
      
      # S3 / LocalStack configuration (matches config/test.exs)
      S3_HOST: localstack
      S3_SCHEME: "http://"
      S3_PORT: "4566"
      S3_BUCKET: firmowid-uploads
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1

    services:
      db:
        image: paradedb/paradedb:0.18.11
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: firmowid_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      localstack:
        image: localstack/localstack:latest
        env:
          SERVICES: s3
          DEBUG: 1
        ports:
          - 4566:4566
        volumes:
          - ${{ github.workspace }}/local/s3-init:/etc/localstack/init/ready.d
        options: >-
          --health-cmd "curl -s http://localhost:4566/_localstack/health | grep -q '\"s3\": \"running\"'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Elixir Project
        uses: ./.github/actions/elixir-setup
        with:
          elixir-version: ${{ needs.extract-versions.outputs.elixir }}
          otp-version: ${{ needs.extract-versions.outputs.otp }}

      - name: Compile project
        run: mix compile --warnings-as-errors
        continue-on-error: true # Remove if you want to enforce

      - name: Check formatting
        run: mix format --check-formatted
        continue-on-error: true # Remove if you want to enforce

      - name: Run Credo
        run: mix credo --strict
        continue-on-error: true # Remove if you want to enforce

      - name: Create and migrate database
        run: |
          mix ecto.create
          mix ecto.migrate

      - name: Run Tests
        run: mix test
