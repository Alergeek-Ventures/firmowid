name: Build and Test
on:
  workflow_call:
    inputs:
      catalog-version:
        description: Snapshot SHA in the translation artifact prepared by CI
        required: true
        type: string
  workflow_dispatch:
    inputs:
      coverage-benchmark:
        description: Run isolated coverage/no-coverage ABBA benchmark (branch only)
        type: boolean
        default: false
        required: false

permissions:
  contents: read

concurrency:
  group: build-and-test-${{ github.event.pull_request.number || github.ref }}${{ github.event_name == 'workflow_dispatch' && inputs.coverage-benchmark && '-coverage-benchmark' || '' }}
  cancel-in-progress: true

jobs:
  translations:
    name: Prepare translations
    if: ${{ github.event_name == 'workflow_dispatch' && !inputs.coverage-benchmark }}
    uses: ./.github/workflows/translations-prepare.yml
    with:
      version: ${{ github.event.pull_request.head.sha || github.sha }}
    secrets:
      ACCENT_API_KEY: ${{ secrets.ACCENT_API_KEY }}
    permissions:
      contents: read

  benchmark-translations:
    name: Export existing main HEAD catalog (read only)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.coverage-benchmark }}
    runs-on: selenge
    permissions:
      contents: read
    outputs:
      catalog-version: ${{ steps.catalog.outputs.version }}
    steps:
      - name: Reject benchmark on main before credentials
        run: |
          if [[ "$GITHUB_REF" != refs/heads/* || "$GITHUB_REF" == 'refs/heads/main' ]]; then
            echo 'Coverage benchmarks must run on a non-main branch.' >&2
            exit 1
          fi

      - name: Checkout exact benchmark commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Enter devenv
        uses: ./.github/actions/devenv

      - name: Resolve existing main HEAD snapshot once
        id: catalog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          main_sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          [[ "$main_sha" =~ ^[0-9a-f]{40}$ ]]
          echo "version=$main_sha" >> "$GITHUB_OUTPUT"

      - name: Export exact existing snapshot without fallback or creation
        env:
          ACCENT_API_KEY: ${{ secrets.ACCENT_API_KEY }}
          ACCENT_VERSION: ${{ steps.catalog.outputs.version }}
        run: |
          set -euo pipefail
          elixir scripts/accent.exs export --version "$ACCENT_VERSION"
          test "$(head -n 1 priv/gettext/pl/LC_MESSAGES/default.po)" = "# Accent version: $ACCENT_VERSION"

      - name: Upload benchmark PO catalog
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: accent-po-${{ github.sha }}
          path: |
            priv/gettext/pl/LC_MESSAGES/default.po
            priv/gettext/uk/LC_MESSAGES/default.po
          if-no-files-found: error

  build:
    name: ${{ github.event_name == 'workflow_dispatch' && inputs.coverage-benchmark && 'Coverage ABBA benchmark' || 'Build and test' }}
    # One shared runner/setup/service definition keeps both benchmark arms identical.
    if: >-
      ${{ !cancelled() &&
          (inputs.catalog-version != '' || needs.translations.result == 'success' || needs.benchmark-translations.result == 'success') }}

    runs-on: selenge
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && inputs.coverage-benchmark && 120 || 360 }}

    needs:
      - translations
      - benchmark-translations
    permissions:
      contents: read
      packages: read

    env:
      MIX_ENV: test
      KSEF_ENV: test
      MCP_RESOURCE_URL: http://localhost:4002/mcp

      # Database configuration (matches config/test.exs)
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: localhost

      # S3 / SeaweedFS configuration (matches config/test.exs)
      S3_HOST: localhost
      S3_SCHEME: "http://"
      S3_BUCKET: firmowid-uploads
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      # The services start in the background while Elixir is set up; "Wait for test
      # services" joins them before the database is used. local/compose.yml owns the ParadeDB
      # image. PRs and the merge queue test with the last published main SeaweedFS image;
      # main uses the image of its own Containerfile, which ci.yml publishes before this job.
      - name: Start test services
        id: services
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          paradedb_image=$(grep 'image:.*paradedb/paradedb' local/compose.yml | sed 's/.*image: *//')
          seaweedfs_image=ghcr.io/alergeek-ventures/firmowid-new/seaweedfs-s3:main
          if [ "$GITHUB_REF" = refs/heads/main ]; then
            seaweedfs_image=ghcr.io/alergeek-ventures/firmowid-new/seaweedfs-s3:containerfile-$(sha256sum deployment/Containerfile.seaweedfs | cut -d ' ' -f 1)
          fi
          echo "paradedb-image=$paradedb_image" >> "$GITHUB_OUTPUT"
          echo "seaweedfs-image=$seaweedfs_image" >> "$GITHUB_OUTPUT"
          printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          # shellcheck disable=SC2016 # The inner shell expands its own positional parameters.
          nohup sh -c '
            docker run -d --name db -p 5432:5432 \
              -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=firmowid_test \
              --health-cmd "pg_isready -U postgres -d firmowid_test" --health-interval 2s \
              --health-timeout 5s --health-retries 30 "$1" &&
            docker run -d --name seaweedfs -p 8333:8333 \
              -e AWS_ACCESS_KEY_ID=test -e AWS_SECRET_ACCESS_KEY=test "$2"
          ' services "$paradedb_image" "$seaweedfs_image" > "$RUNNER_TEMP/services.log" 2>&1 &

      - name: Download generated PO catalog
        uses: ./.github/actions/download-translations
        with:
          catalog-version: ${{ inputs.catalog-version || needs.translations.outputs.catalog-version || needs.benchmark-translations.outputs.catalog-version }}

      - name: Generate isolated test keys
        run: |
          secret_key_base="$(openssl rand -base64 48)"
          cloak_vault_key="$(openssl rand -base64 32)"
          oauth2_signing_secret="$(openssl rand -base64 48)"
          printf '%s\n' "SECRET_KEY_BASE=$secret_key_base" "CLOAK_VAULT_KEY=$cloak_vault_key" "OAUTH2_SIGNING_SECRET=$oauth2_signing_secret" >> "$GITHUB_ENV"

      - name: Setup Elixir Project
        id: setup
        uses: ./.github/actions/elixir-setup
        with:
          cache-key: ${{ github.event_name == 'workflow_dispatch' && inputs.coverage-benchmark && format('coverage-benchmark-{0}-{1}', github.run_id, github.run_attempt) || 'v2' }}

      - name: Wait for test services
        run: |
          for _ in $(seq 120); do
            if [ "$(docker inspect --format '{{.State.Health.Status}}' db 2> /dev/null)" = healthy ] &&
              (exec 3<> /dev/tcp/127.0.0.1/8333) 2> /dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "::error::Test services did not start within 120 s"
          cat "$RUNNER_TEMP/services.log"
          docker ps -a
          exit 1

      - name: Create and migrate database
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.coverage-benchmark) }}
        run: mix ash.setup

      - name: Run tests with LCOV coverage report
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.coverage-benchmark) }}
        id: tests
        run: |
          set -o pipefail
          mix coveralls.lcov 2>&1 | tee coveralls.log

      - name: Run paired coverage benchmark on this runner
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.coverage-benchmark }}
        env:
          BENCHMARK_CATALOG_SHA: ${{ needs.benchmark-translations.outputs.catalog-version }}
          BENCHMARK_OTP: ${{ steps.setup.outputs.otp-version }}
          BENCHMARK_ELIXIR: ${{ steps.setup.outputs.elixir-version }}
          BENCHMARK_DB_CONTAINER: db
          BENCHMARK_S3_CONTAINER: seaweedfs
          BENCHMARK_DB_IMAGE: ${{ steps.services.outputs.paradedb-image }}
          BENCHMARK_S3_IMAGE: ${{ steps.services.outputs.seaweedfs-image }}
          BENCHMARK_CACHE_KEY: coverage-benchmark-${{ github.run_id }}-${{ github.run_attempt }}
        run: bash scripts/ci-coverage-benchmark.sh

      - name: Upload benchmark evidence even on failure
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.coverage-benchmark }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-benchmark-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/coverage-benchmark/
          if-no-files-found: warn

      - name: Upload test log
        if: ${{ always() && (steps.tests.outcome == 'success' || steps.tests.outcome == 'failure') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: excoveralls-test-log
          path: coveralls.log
          if-no-files-found: warn

      - name: Upload coverage LCOV report
        if: ${{ always() && (steps.tests.outcome == 'success' || steps.tests.outcome == 'failure') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: excoveralls-lcov-report
          path: cover/lcov.info
          if-no-files-found: ${{ steps.tests.outcome == 'success' && 'error' || 'warn' }}

  coverage-report:
    name: Publish coverage summary and PR comment
    # The unused translations branch is skipped; do not propagate that to reporting.
    # Only pull requests get the coverage comment; other runs would occupy a runner for nothing.
    if: ${{ !cancelled() && needs.build.result == 'success' && github.event_name == 'pull_request' }}
    runs-on: selenge-small
    needs: build
    permissions:
      actions: read
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download coverage LCOV report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: excoveralls-lcov-report
          path: cover

      - name: Publish coverage summary and PR comment
        uses: k1LoW/octocov-action@a167dc0dee441b7ffc45e1b862ab55ec0d87f278 # v1
        with:
          config: .octocov.yml
