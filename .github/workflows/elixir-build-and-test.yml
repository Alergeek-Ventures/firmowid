name: Build and Test
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "*"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  extract-versions:
    name: Extract versions and service images
    runs-on: self-hosted
    permissions:
      contents: read
      packages: read
      pull-requests: read
    container:
      image: ghcr.io/alergeek-ventures/infrastructure/cicd-image:5b1d7150888c47322a6b5cda04796dfd1dbfb34c
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.github_token }}
    outputs:
      elixir: ${{ steps.versions.outputs.elixir }}
      otp: ${{ steps.versions.outputs.otp }}
      paradedb_image: ${{ steps.images.outputs.paradedb_image }}
      seaweedfs_image: ${{ steps.images.outputs.seaweedfs_image }}
      seaweedfs_pr_image_required: ${{ steps.images.outputs.seaweedfs_pr_image_required }}
      seaweedfs_pr_number: ${{ steps.images.outputs.seaweedfs_pr_number }}
      seaweedfs_pr_head_sha: ${{ steps.images.outputs.seaweedfs_pr_head_sha }}
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Extract versions
        id: versions
        run: |
          ELIXIR_FULL=$(grep "^elixir " .tool-versions | awk '{print $2}')
          OTP=$(grep "^erlang " .tool-versions | awk '{print $2}')
          ELIXIR=$(echo "$ELIXIR_FULL" | sed 's/-otp-.*//')
          echo "elixir=$ELIXIR" >> $GITHUB_OUTPUT
          echo "otp=$OTP" >> $GITHUB_OUTPUT
          echo "Detected from .tool-versions:"
          echo "  Elixir: $ELIXIR"
          echo "  OTP: $OTP"

      - name: Extract service images
        id: images
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          PARADEDB_IMAGE=$(grep 'image:.*paradedb/paradedb' local/compose.yml | sed 's/.*image: *//')
          SEAWEEDFS_VERSION=$(grep '^FROM' deployment/Containerfile.seaweedfs | sed 's/.*seaweedfs://' | sed 's/@.*//')
          SEAWEEDFS_IMAGE="ghcr.io/alergeek-ventures/firmowid/seaweedfs-s3:${SEAWEEDFS_VERSION}"
          SEAWEEDFS_PR_IMAGE_REQUIRED="false"

          if [ "$EVENT_NAME" = "pull_request" ]; then
            PR_FILES_URL="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files?per_page=100"

            if curl --fail --silent --show-error \
              --header "Authorization: Bearer $GITHUB_TOKEN" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "$PR_FILES_URL" | grep '"filename": "deployment/Containerfile.seaweedfs"' >/dev/null; then
              SEAWEEDFS_IMAGE="ghcr.io/alergeek-ventures/firmowid/seaweedfs-s3:pr-${PR_NUMBER}-${PR_HEAD_SHA}"
              SEAWEEDFS_PR_IMAGE_REQUIRED="true"
            fi
          fi

          echo "paradedb_image=$PARADEDB_IMAGE" >> $GITHUB_OUTPUT
          echo "seaweedfs_image=$SEAWEEDFS_IMAGE" >> $GITHUB_OUTPUT
          echo "seaweedfs_pr_image_required=$SEAWEEDFS_PR_IMAGE_REQUIRED" >> $GITHUB_OUTPUT
          echo "seaweedfs_pr_number=$PR_NUMBER" >> $GITHUB_OUTPUT
          echo "seaweedfs_pr_head_sha=$PR_HEAD_SHA" >> $GITHUB_OUTPUT
          echo "Detected from local/compose.yml:"
          echo "  ParadeDB: $PARADEDB_IMAGE"
          echo "Selected SeaweedFS image:"
          echo "  SeaweedFS: $SEAWEEDFS_IMAGE"

  verify-service-images:
    name: Verify service images are available
    runs-on: self-hosted
    needs: extract-versions
    permissions:
      packages: read
    container:
      image: ghcr.io/alergeek-ventures/infrastructure/cicd-image:5b1d7150888c47322a6b5cda04796dfd1dbfb34c
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.github_token }}

    steps:
      - name: Log in to GHCR
        run: |
          printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify SeaweedFS image exists
        env:
          SEAWEEDFS_IMAGE: ${{ needs.extract-versions.outputs.seaweedfs_image }}
          SEAWEEDFS_PR_IMAGE_REQUIRED: ${{ needs.extract-versions.outputs.seaweedfs_pr_image_required }}
          SEAWEEDFS_PR_NUMBER: ${{ needs.extract-versions.outputs.seaweedfs_pr_number }}
          SEAWEEDFS_PR_HEAD_SHA: ${{ needs.extract-versions.outputs.seaweedfs_pr_head_sha }}
        run: |
          if docker manifest inspect "$SEAWEEDFS_IMAGE" >/dev/null 2>&1; then
            echo "✅ SeaweedFS image is available: $SEAWEEDFS_IMAGE"
            exit 0
          fi

          echo "❌ SeaweedFS image is not available: $SEAWEEDFS_IMAGE"
          echo ""

          if [ "$SEAWEEDFS_PR_IMAGE_REQUIRED" = "true" ]; then
            echo "This PR changes deployment/Containerfile.seaweedfs, so Build/Test requires a PR-scoped SeaweedFS image."
            echo ""
            echo "Publish it from your machine with GitHub CLI:"
            echo ""
            echo "  gh workflow run \"Build SeaweedFS S3 PR Image\" --ref main -f pr-number=$SEAWEEDFS_PR_NUMBER -f head-sha=$SEAWEEDFS_PR_HEAD_SHA"
            echo ""
            echo "Expected tag:"
            echo ""
            echo "  $SEAWEEDFS_IMAGE"
            echo ""
            echo "After the publisher workflow succeeds, rerun this Build and Test workflow."
          else
            echo "Build/Test expected the main SeaweedFS image tag to already exist."
            echo "Run the main publisher workflow or check GHCR package availability."
            echo ""
            echo "Expected tag:"
            echo ""
            echo "  $SEAWEEDFS_IMAGE"
          fi

          exit 1

  build:
    name: Build and test

    # required for self-hosted runners
    runs-on: self-hosted
    container:
      image: ghcr.io/alergeek-ventures/infrastructure/cicd-image:5b1d7150888c47322a6b5cda04796dfd1dbfb34c
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.github_token }}
    # end

    needs:
      - extract-versions
      - verify-service-images
    permissions:
      contents: read
      packages: read

    env:
      MIX_ENV: test
      KSEF_ENV: test

      # Database configuration (matches config/test.exs)
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: db
      DB_PORT: "5432"

      SECRET_KEY_BASE: "REMOVED_PHOENIX_SECRET_KEY_BASE"
      CLOAK_VAULT_KEY: "REMOVED_CLOAK_VAULT_KEY"

      # S3 / SeaweedFS configuration (matches config/test.exs)
      S3_HOST: seaweedfs
      S3_SCHEME: "http://"
      S3_PORT: "8333"
      S3_BUCKET: firmowid-uploads
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1

    services:
      db:
        image: ${{ needs.extract-versions.outputs.paradedb_image }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: firmowid_test
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s
          --health-retries 5

      seaweedfs:
        image: ${{ needs.extract-versions.outputs.seaweedfs_image }}
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.github_token }}
        env:
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup Elixir Project
        uses: ./.github/actions/elixir-setup
        with:
          elixir-version: ${{ needs.extract-versions.outputs.elixir }}
          otp-version: ${{ needs.extract-versions.outputs.otp }}

      - name: Create and migrate database
        run: mix ash.setup

      - name: Run tests with LCOV coverage report
        run: |
          if mix coveralls.lcov > coveralls.log 2>&1; then
            echo "Tests passed and LCOV coverage report was generated in cover/lcov.info."
          else
            echo "mix coveralls.lcov failed. Full log:"
            cat coveralls.log
            exit 1
          fi

      - name: Upload coverage LCOV report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: excoveralls-lcov-report
          path: cover/lcov.info
          if-no-files-found: error

  coverage-report:
    name: Publish coverage summary and PR comment
    runs-on: ubuntu-latest
    needs: build
    permissions:
      actions: read
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Download coverage LCOV report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: excoveralls-lcov-report
          path: cover

      - name: Publish coverage summary and PR comment
        uses: k1LoW/octocov-action@b3b6ee60482a667950f87553abf1df63217235d9 # v1
        with:
          config: .octocov.yml
