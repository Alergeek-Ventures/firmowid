name: Build and Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "*"

jobs:
  extract-versions:
    name: Extract versions from .tool-versions
    runs-on: ubuntu-latest
    outputs:
      elixir: ${{ steps.versions.outputs.elixir }}
      otp: ${{ steps.versions.outputs.otp }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Extract versions
        id: versions
        run: |
          ELIXIR_FULL=$(grep "^elixir " .tool-versions | awk '{print $2}')
          OTP=$(grep "^erlang " .tool-versions | awk '{print $2}')
          ELIXIR=$(echo "$ELIXIR_FULL" | sed 's/-otp-.*//')
          
          echo "elixir=$ELIXIR" >> $GITHUB_OUTPUT
          echo "otp=$OTP" >> $GITHUB_OUTPUT
          
          echo "Detected from .tool-versions:"
          echo "  Elixir: $ELIXIR"
          echo "  OTP: $OTP"

  build:
    name: Build and test
    runs-on: ubuntu-latest
    needs: extract-versions
    env:
      MIX_ENV: test
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5433/firmowid_test?sslmode=prefer"
      SECRET_KEY_BASE: "REMOVED_PHOENIX_SECRET_KEY_BASE"

    services:
      db:
        image: paradedb/paradedb:0.18.11
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: firmowid_test
        ports: ["5433:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      s3-emulator:
        image: localstack/localstack:latest
        env:
          SERVICES: s3
          AWS_DEFAULT_REGION: us-east-1
        ports: ["4566:4566"]

    steps:
      - name: Set up temporary directory
        run: |
          TEMP_DIR="$RUNNER_TEMP/localstack-init"
          mkdir -p "$TEMP_DIR"
          echo "TEMP_DIR=$TEMP_DIR" >> $GITHUB_ENV

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Copy files to temporary directory
        run: |
          cp -r ./local/s3-init/* "$RUNNER_TEMP/localstack-init/"

      - name: Stop and restart LocalStack with volume
        run: |
          CONTAINER_ID=$(docker ps --filter "ancestor=localstack/localstack" --format "{{.ID}}")
          docker stop "$CONTAINER_ID"
          docker rm "$CONTAINER_ID"
          docker run -d --name s3-emulator \
            -p 4566:4566 \
            -e SERVICES=s3 \
            -e AWS_DEFAULT_REGION=us-east-1 \
            -v "$RUNNER_TEMP/localstack-init:/etc/localstack/init/ready.d" \
            localstack/localstack:latest

      - name: Setup Elixir Project
        uses: ./.github/actions/elixir-setup
        with:
          elixir-version: ${{ needs.extract-versions.outputs.elixir }}
          otp-version: ${{ needs.extract-versions.outputs.otp }}

      - name: Run Migrations
        run: mix ecto.migrate

      - name: Run Tests
        run: mix test
