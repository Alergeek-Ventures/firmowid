name: Prepare translations

on:
  workflow_call:
    inputs:
      version:
        description: Full code commit SHA whose existing translations should be exported
        required: true
        type: string
    secrets:
      ACCENT_API_KEY:
        description: Read-only Accent project key for exporting the current catalog
        required: false
    outputs:
      catalog-version:
        description: Full commit SHA the prepared catalog is marked with
        value: ${{ jobs.prepare.outputs.catalog-version }}
      published:
        description: Whether a snapshot for this main commit was already published
        value: ${{ jobs.prepare.outputs.published }}
      content-only:
        description: Whether a pull request changes only guides and static files
        value: ${{ jobs.prepare.outputs.content-only }}

permissions:
  contents: read

jobs:
  prepare:
    name: Export Accent PO catalog
    runs-on: selenge-small
    permissions:
      contents: read
    outputs:
      catalog-version: ${{ steps.catalog.outputs.version }}
      published: ${{ steps.published.outputs.published }}
      content-only: ${{ steps.changes.outputs.content-only }}
    env:
      ACCENT_VERSION: ${{ inputs.version || github.sha }}
      CALLER_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Reject fork pull requests before credentials
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "Translation credentials are unavailable for fork pull requests."
          echo "Run this workflow from a branch in the repository, or use a maintainer-triggered workflow."
          exit 1

      - name: Validate exact full caller SHA
        run: |
          if [[ ! "$ACCENT_VERSION" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "Accent version must be a full 40-character Git SHA."
            exit 1
          fi

          if [[ "${CALLER_COMMIT,,}" != "${ACCENT_VERSION,,}" ]]; then
            echo "Accent version must equal the calling workflow commit."
            exit 1
          fi

      - name: Checkout exact caller commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.version || github.sha }}
          persist-credentials: false

      # scripts/accent.exs needs only Elixir, Hex and, on main, gh. They come from devenv's
      # pinned nixpkgs, beam-packages.nix and hex-version, so they are the same store paths
      # and Hex as in devenv, without the ~20 s it takes to evaluate the whole devenv on this
      # critical path.
      # fetchTarball with the locked hash reuses the nixpkgs source devenv already put in
      # the runner's store; a flake reference would unpack nixpkgs again (~20 s).
      - name: Install devenv's Elixir, Hex and gh
        run: |
          set -euo pipefail
          read -r rev nar_hash < <(jq -er '.nodes.nixpkgs.locked | "\(.rev) \(.narHash)"' devenv.lock)
          bins=$(nix build --impure --no-link --print-out-paths --argstr rev "$rev" --argstr narHash "$nar_hash" --expr '
            { rev, narHash }:
            let
              pkgs = import (builtins.fetchTarball {
                url = "https://github.com/NixOS/nixpkgs/archive/" + rev + ".tar.gz";
                sha256 = narHash;
              }) { };
              beamPackages = import ./beam-packages.nix { inherit pkgs; };
            in [ beamPackages.elixir_1_20 pkgs.gh ]' | sed 's|$|/bin|')
          hex=$(sed -n 's/^ *hex-version = "\(.*\)";$/\1/p' devenv.nix)
          PATH="$(paste -sd: <<< "$bins"):$PATH" mix local.hex "$hex" --force
          echo "$bins" >> "$GITHUB_PATH"
          echo "LANG=C.UTF-8" >> "$GITHUB_ENV"

      # A main commit keeps the snapshot it was first validated and deployed with.
      - name: Reuse the published snapshot of this main commit
        id: published
        if: github.ref == 'refs/heads/main'
        run: |
          if elixir scripts/accent.exs export --version "$ACCENT_VERSION"; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Export and validate the current Accent catalog
        if: steps.published.outputs.published != 'true'
        env:
          ACCENT_API_KEY: ${{ secrets.ACCENT_API_KEY }}
        run: elixir scripts/accent.exs snapshot --version "$ACCENT_VERSION"

      - name: Record selected catalog version
        id: catalog
        run: |
          set -euo pipefail
          marker=$(head -n 1 priv/gettext/pl/LC_MESSAGES/default.po)
          [[ "$marker" == "# Accent version: $ACCENT_VERSION" ]]
          echo "version=$ACCENT_VERSION" >> "$GITHUB_OUTPUT"

      # CI skips Dialyzer and the Docker build for pull requests changing only guides and
      # static files. The compare API needs only contents: read; it lists at most 300 files,
      # so a longer list counts as more than content.
      - name: Detect pull requests changing only content
        id: changes
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          files=$(gh api "repos/$GITHUB_REPOSITORY/compare/$BASE_SHA...$HEAD_SHA" \
            --jq 'if (.files | length) >= 300 then "too-many" else .files[].filename end')
          if grep -Evq '^priv/(guides|static)/' <<< "$files"; then
            echo "content-only=false" >> "$GITHUB_OUTPUT"
          else
            echo "content-only=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload generated PO catalog
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: accent-po-${{ env.ACCENT_VERSION }}
          path: |
            priv/gettext/pl/LC_MESSAGES/default.po
            priv/gettext/uk/LC_MESSAGES/default.po
          if-no-files-found: error
