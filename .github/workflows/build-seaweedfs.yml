name: Build SeaweedFS S3 Image

on:
  push:
    branches:
      - main
    paths:
      - deployment/Containerfile.seaweedfs
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Build and push SeaweedFS S3 image
    runs-on: blacksmith-4vcpu-ubuntu-2404
    container:
      image: ghcr.io/alergeek-ventures/infrastructure/cicd-image:5b1d7150888c47322a6b5cda04796dfd1dbfb34c
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.github_token }}

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Blacksmith Builder
        uses: useblacksmith/setup-docker-builder@19215110ab936351210feebdfa5b440b4493e184 # v2.2.0

      - name: Extract SeaweedFS version from Containerfile
        id: version
        run: |
          VERSION=$(grep '^FROM' deployment/Containerfile.seaweedfs | sed 's/.*seaweedfs://' | sed 's/@.*//')
          echo "tag=$VERSION" >> $GITHUB_OUTPUT
          echo "Detected SeaweedFS version: $VERSION"

      - name: Build and push
        uses: useblacksmith/build-push-action@9b0579bbec7a6cad2f171596c57e7ac1e7658850 # v2
        with:
          context: .
          file: ./deployment/Containerfile.seaweedfs
          push: true
          tags: |
            ghcr.io/alergeek-ventures/firmowid/seaweedfs-s3:main
            ghcr.io/alergeek-ventures/firmowid/seaweedfs-s3:${{ steps.version.outputs.tag }}
            ghcr.io/alergeek-ventures/firmowid/seaweedfs-s3:sha-${{ github.sha }}
