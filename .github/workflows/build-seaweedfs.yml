name: Build SeaweedFS S3 Image

on:
  push:
    branches:
      - main
    paths:
      - deployment/Containerfile.seaweedfs
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Build and push SeaweedFS S3 image
    runs-on: blacksmith-4vcpu-ubuntu-2404

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - name: Extract SeaweedFS version from Containerfile
        id: version
        run: |
          VERSION=$(grep '^FROM' deployment/Containerfile.seaweedfs | sed 's/.*seaweedfs://' | sed 's/@.*//')
          echo "tag=$VERSION" >> $GITHUB_OUTPUT
          echo "Detected SeaweedFS version: $VERSION"

      - name: Build and push
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: ./deployment/Containerfile.seaweedfs
          push: true
          tags: |
            ghcr.io/alergeek-ventures/firmowid-new/seaweedfs-s3:main
            ghcr.io/alergeek-ventures/firmowid-new/seaweedfs-s3:${{ steps.version.outputs.tag }}
            ghcr.io/alergeek-ventures/firmowid-new/seaweedfs-s3:sha-${{ github.sha }}
