name: Build SeaweedFS S3 Image

on:
  push:
    branches:
      - main
    paths:
      - deployment/Containerfile.seaweedfs
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Build and push SeaweedFS S3 image
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/alergeek-ventures/infrastructure/cicd-image:5b1d7150888c47322a6b5cda04796dfd1dbfb34c
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.github_token }}

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Extract SeaweedFS version from Containerfile
        id: version
        run: |
          VERSION=$(grep '^FROM' deployment/Containerfile.seaweedfs | sed 's/.*seaweedfs://' | sed 's/@.*//')
          echo "tag=$VERSION" >> $GITHUB_OUTPUT
          echo "Detected SeaweedFS version: $VERSION"

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./deployment/Containerfile.seaweedfs
          push: true
          tags: |
            ghcr.io/alergeek-ventures/firmowid/seaweedfs-s3:main
            ghcr.io/alergeek-ventures/firmowid/seaweedfs-s3:${{ steps.version.outputs.tag }}
            ghcr.io/alergeek-ventures/firmowid/seaweedfs-s3:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
