name: Build SeaweedFS S3 Image

on:
  push:
    branches:
      - main
    paths:
      - deployment/Containerfile.seaweedfs
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Build and push SeaweedFS S3 image
    runs-on: self-hosted
    container:
      image: ghcr.io/alergeek-ventures/infrastructure/cicd-image:5b1d7150888c47322a6b5cda04796dfd1dbfb34c
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.github_token }}

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract SeaweedFS version from Containerfile
        id: version
        run: |
          VERSION=$(grep '^FROM' deployment/Containerfile.seaweedfs | sed 's/.*seaweedfs://' | sed 's/@.*//')
          echo "tag=$VERSION" >> $GITHUB_OUTPUT
          echo "Detected SeaweedFS version: $VERSION"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./deployment/Containerfile.seaweedfs
          push: true
          tags: |
            ghcr.io/alergeek-ventures/firmowid/seaweedfs-s3:latest
            ghcr.io/alergeek-ventures/firmowid/seaweedfs-s3:${{ steps.version.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
