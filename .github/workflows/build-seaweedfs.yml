name: Build SeaweedFS S3 Image

on:
  push:
    branches:
      - main
    paths:
      - deployment/Containerfile.seaweedfs
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Build and push SeaweedFS S3 image
    runs-on: self-hosted
    container:
      image: ghcr.io/alergeek-ventures/infrastructure/cicd-image:5b1d7150888c47322a6b5cda04796dfd1dbfb34c
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.github_token }}

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

      - name: Extract SeaweedFS version from Containerfile
        id: version
        run: |
          VERSION=$(grep '^FROM' deployment/Containerfile.seaweedfs | sed 's/.*seaweedfs://' | sed 's/@.*//')
          echo "tag=$VERSION" >> $GITHUB_OUTPUT
          echo "Detected SeaweedFS version: $VERSION"

      - name: Build and push
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: ./deployment/Containerfile.seaweedfs
          push: true
          tags: |
            ghcr.io/alergeek-ventures/firmowid/seaweedfs-s3:main
            ghcr.io/alergeek-ventures/firmowid/seaweedfs-s3:${{ steps.version.outputs.tag }}
            ghcr.io/alergeek-ventures/firmowid/seaweedfs-s3:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
