# Dependabot configuration
#
# Schedule: Every Monday at 06:00 Warsaw time.
#
# Strategy:
#   - Minor/patch (non-breaking) updates are grouped into a single PR per ecosystem.
#   - Major (breaking) updates get individual PRs.
#   - Security patches are instant (repo-level setting, not configured here).
#   - 7-day cooldown on all updates (supply chain attack mitigation).
#
# Ecosystems:
#   - mix          → Elixir deps (mix.exs / mix.lock)
#   - docker       → Containerfiles in /deployment (app, seaweedfs, gotenberg)
#   - docker-compose → Service images in /local/compose.yml (paradedb, seaweedfs)
#   - github-actions → Action versions in .github/workflows/

version: 2
updates:
  # ── Elixir dependencies ──────────────────────────────────────────────
  - package-ecosystem: "mix"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Warsaw"
    open-pull-requests-limit: 15
    cooldown:
      default-days: 7
    groups:
      non-breaking:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"

  # ── Container images (Containerfile.app, .seaweedfs, .gotenberg) ─────
  - package-ecosystem: "docker"
    directory: "/deployment"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Warsaw"
    cooldown:
      default-days: 7
    groups:
      container-base-images:
        patterns:
          - "*"

  # ── Docker Compose service images (paradedb, seaweedfs) ─────────────
  - package-ecosystem: "docker-compose"
    directory: "/local"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Warsaw"
    cooldown:
      default-days: 7
    allow:
      - dependency-name: "paradedb/paradedb"
    groups:
      local-compose-images:
        patterns:
          - "paradedb/paradedb"

  # ── GitHub Actions ──────────────────────────────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Warsaw"
    cooldown:
      default-days: 7
    groups:
      non-breaking:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
