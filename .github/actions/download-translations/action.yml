name: Download translations
description: Download the code commit artifact, validate its selected snapshot SHA and make its marker commit-independent
inputs:
  version:
    description: Full commit SHA whose translation artifact should be downloaded
    required: false
    default: ${{ github.event.pull_request.head.sha || github.sha }}
  catalog-version:
    description: Actual full snapshot SHA selected by the translations job
    required: false
runs:
  using: composite
  steps:
    - name: Download generated PO catalog
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
      with:
        name: accent-po-${{ inputs.version }}
        path: priv/gettext
    - name: Validate catalog version
      shell: bash
      env:
        ACCENT_VERSION: ${{ inputs.catalog-version || inputs.version }}
      run: |
        set -euo pipefail
        [[ "$ACCENT_VERSION" =~ ^[0-9a-fA-F]{40}$ ]]
        for catalog in priv/gettext/{pl,uk}/LC_MESSAGES/default.po; do
          test -f "$catalog"
          test "$(head -n 1 "$catalog")" = "# Accent version: $ACCENT_VERSION" || {
            echo "Downloaded catalog $catalog does not match $ACCENT_VERSION." >&2
            exit 1
          }
          # The marker names each commit, so a changed marker alone recompiled the Gettext
          # backend and its 61 compile-time dependents (17–39 s) in every job restoring
          # another commit's build. Once checked, a constant line keeps unchanged catalogs
          # byte-identical across commits.
          sed -i '1s/.*/# Accent version: checked by CI/' "$catalog"
        done
