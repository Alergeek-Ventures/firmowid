name: Setup Accent CLI
description: Install the pinned Accent CLI used by translation tooling
runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 26.13.1
    - name: Setup Erlang and Elixir
      uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
      with:
        version-file: .tool-versions
        version-type: strict
        install-hex: false
        install-rebar: false
    # Keep in sync with hex-version in devenv.nix (checked by version-sync-check.yml).
    - name: Install Hex
      shell: bash
      run: mix local.hex 2.7.0 --force
    - name: Install Accent CLI
      shell: bash
      run: npm install --global accent-cli@0.19.0
