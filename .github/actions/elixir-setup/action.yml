name: Setup Elixir Project
description: Enters devenv, fetches dependencies, and manages build caching.
inputs:
  cache-key:
    required: false
    default: "v2"
    description: Cache key prefix for dependency and build caches
  build-app:
    required: false
    default: "true"
    description: Whether to compile the application
  build-deps:
    required: false
    default: "true"
    description: Whether to compile dependencies
  build-flags:
    required: false
    default: "--warnings-as-errors"
    description: Flags to pass to mix compile
  install-rebar:
    required: false
    default: "false"
    description: Whether to install rebar

outputs:
  build-cache-identity:
    description: "What a build in the runner's build cache must have been made with to be reused"
    value: ${{ steps.runner-cache.outputs.identity }}
  otp-version:
    description: "Exact OTP version devenv provides"
    value: ${{ steps.beam.outputs.otp-version }}
  elixir-version:
    description: "Exact Elixir version devenv provides"
    value: ${{ steps.beam.outputs.elixir-version }}

runs:
  using: "composite"
  steps:
    # devenv.nix owns Elixir, Erlang and Hex; its enterShell installs Hex.
    - name: Enter devenv
      uses: ./.github/actions/devenv

    # Cache keys name the toolchain down to both BEAM store paths: PLTs, deps and
    # _build point into them, and a devenv refresh can move either without a release bump.
    - name: Read BEAM versions
      id: beam
      shell: bash
      run: |
        set -euo pipefail
        root=$(erl -noshell -eval 'io:put_chars(code:root_dir()), halt().')
        otp=$(erl -noshell -eval 'io:put_chars(erlang:system_info(otp_release)), halt().')
        store=$(basename "${root%%/lib/erlang}")
        otp_version=$(cat "$root/releases/$otp/OTP_VERSION")
        elixir_identity=$(elixir -e '
          lib_dir = :code.lib_dir(:elixir) |> to_string() |> Path.expand()
          # The devenv wrapper can add a nested /lib/elixir before the final suffix.
          root = lib_dir |> String.split("/lib/elixir", parts: 2) |> hd()
          store = Path.basename(root)

          unless String.ends_with?(lib_dir, "/lib/elixir") and
                   Path.dirname(root) == "/nix/store" and
                   Regex.match?(~r/^[0-9a-z]{32}-[^[:space:]]+$/, store) do
            raise "expected Elixir at /nix/store/<identity>/lib/elixir"
          end

          IO.write([System.version(), " ", store])
        ')
        if [[ ! "$elixir_identity" =~ ^([^[:space:]]+)[[:space:]]([0-9a-z]{32}-[^[:space:]]+)$ ]]; then
          echo "::error::Invalid Elixir version/store identity" >&2
          exit 1
        fi
        elixir_version=${BASH_REMATCH[1]}
        elixir_store=${BASH_REMATCH[2]}
        # Production builds from .tool-versions (the lint job in ci.yml ties it to the Containerfile).
        pinned_otp=$(awk '$1 == "erlang" { print $2 }' .tool-versions)
        pinned_elixir=$(awk '$1 == "elixir" { sub(/-otp-.*/, "", $2); print $2 }' .tool-versions)
        if [ "$otp_version" != "$pinned_otp" ] || [ "$elixir_version" != "$pinned_elixir" ]; then
          echo "::error::devenv provides OTP $otp_version and Elixir $elixir_version; .tool-versions pins $pinned_otp and $pinned_elixir"
          exit 1
        fi
        echo "otp-version=devenv-OTP-$otp_version-${store:0:8}" >> "$GITHUB_OUTPUT"
        echo "elixir-version=devenv-v$elixir_version-${elixir_store:0:8}" >> "$GITHUB_OUTPUT"

    # Quality and Build/Test share compiled artifacts. Different compile-time
    # service ports invalidate the whole application, even on an exact cache hit.
    - name: Set shared test service ports
      if: env.MIX_ENV == 'test'
      run: |
        printf '%s\n' 'DB_PORT=5432' 'S3_PORT=8333' >> "$GITHUB_ENV"
      shell: sh

    # Selenge runners get /cache/firmowid, a copy-on-write clone of the deps, _build and Hex
    # cache that main's last push left there (infrastructure: av.ci_runners build caches).
    # The job builds in the clone itself, and Mix recompiles what differs. Copying its
    # ~22,000 files into the job instead left reflinked extents in every runner's container
    # that made deleting it slow on the host's btrfs, until deletions backed up and stalled
    # all containers (2026-11-26). _build cannot be a symlink: Mix links each app's priv by
    # a relative path that would resolve from the clone; MIX_BUILD_ROOT makes Mix compute it
    # from there. deps can, and keeps the path assets/package.json reaches with ../deps.
    # Other runners, other toolchains and the isolated coverage benchmark (its own
    # cache-key) use the GitHub cache below.
    - name: Restore the runner's build cache
      id: runner-cache
      shell: bash
      env:
        IDENTITY: ${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ env.MIX_ENV || 'dev' }}
        CACHE_KEY: ${{ inputs.cache-key }}
      run: |
        set -euo pipefail
        echo "identity=$IDENTITY" >> "$GITHUB_OUTPUT"
        dir=/cache/firmowid
        if [ "$CACHE_KEY" = v2 ] && [ -f "$dir/IDENTITY" ] && [ "$(cat "$dir/IDENTITY")" = "$IDENTITY" ]; then
          ln -s "$dir/deps" deps
          printf '%s\n' "MIX_BUILD_ROOT=$dir/_build" "HEX_HOME=$dir/hex" >> "$GITHUB_ENV"
          echo "hit=true" >> "$GITHUB_OUTPUT"
          echo "Building on deps and _build of main $(cat "$dir/COMMIT") in the runner's build cache."
        fi

    # The last fallbacks ignore config and lock changes; Mix recompiles only the
    # dependencies whose lock entry or compile-time config changed.
    - name: Get deps cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      id: deps-cache
      if: steps.runner-cache.outputs.hit != 'true'
      with:
        path: deps/
        key: deps-${{ inputs.cache-key }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ env.MIX_ENV || 'dev' }}-${{ hashFiles('mix.exs', 'config/**/*.exs') }}-${{ hashFiles('mix.lock') }}
        restore-keys: |
          deps-${{ inputs.cache-key }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ env.MIX_ENV || 'dev' }}-${{ hashFiles('mix.exs', 'config/**/*.exs') }}-
          deps-${{ inputs.cache-key }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ env.MIX_ENV || 'dev' }}-

    - name: Get build cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      id: build-cache
      if: steps.runner-cache.outputs.hit != 'true'
      with:
        # Keep PLTs out of the revision cache; they have their own lifecycle.
        path: |
          _build/${{ env.MIX_ENV || 'dev' }}/lib
          _build/${{ env.MIX_ENV || 'dev' }}/.mix
          _build/${{ env.MIX_ENV || 'dev' }}/consolidated
        key: build-${{ inputs.cache-key }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ env.MIX_ENV || 'dev' }}-${{ hashFiles('mix.exs', 'config/**/*.exs') }}-${{ hashFiles('mix.lock') }}-${{ github.event.pull_request.head.sha || github.sha }}
        restore-keys: |
          build-${{ inputs.cache-key }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ env.MIX_ENV || 'dev' }}-${{ hashFiles('mix.exs', 'config/**/*.exs') }}-${{ hashFiles('mix.lock') }}-
          build-${{ inputs.cache-key }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ env.MIX_ENV || 'dev' }}-

    - name: Get Hex cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      id: hex-cache
      if: steps.runner-cache.outputs.hit != 'true' && steps.deps-cache.outputs.cache-hit != 'true'
      with:
        path: ~/.hex
        key: hex-${{ inputs.cache-key }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ env.MIX_ENV || 'dev' }}-${{ hashFiles('mix.lock') }}
        restore-keys: |
          hex-${{ inputs.cache-key }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ env.MIX_ENV || 'dev' }}-

    - name: Install Rebar
      run: mix local.rebar --force
      shell: sh
      if: inputs.install-rebar == 'true'

    - name: Install Dependencies
      run: mix deps.get
      shell: sh

    # Normally we'd use `mix deps.compile` here, however that incurs a large
    # performance penalty when the dependencies are already fully compiled:
    # https://elixirforum.com/t/github-action-cache-elixir-always-recompiles-dependencies-elixir-1-13-3/45994/12
    #
    # Accoring to Jose Valim at the above link `mix loadpaths` will check and
    # compile missing dependencies
    - name: Compile Dependencies
      run: mix loadpaths
      shell: sh
      if: inputs.build-deps == 'true'
      env:
        MIX_OS_DEPS_COMPILE_PARTITION_COUNT: 4

    - name: Compile Application
      run: mix compile ${{ inputs.build-flags }}
      shell: sh
      if: inputs.build-app == 'true'
      env:
        ERL_COMPILER_OPTIONS: "+JPn"

    - name: Download Locales
      run: mix localize.setup
      shell: sh
      if: inputs.build-app == 'true'

    # Save completed setup before a later quality check or test can fail. A merge_group run
    # saves nothing: its caches are scoped to a temporary queue branch no later run can read.
    - name: Save Hex cache
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      if: github.event_name != 'merge_group' && steps.runner-cache.outputs.hit != 'true' && steps.hex-cache.outcome == 'success' && steps.hex-cache.outputs.cache-hit != 'true'
      with:
        path: ~/.hex
        key: ${{ steps.hex-cache.outputs.cache-primary-key }}

    - name: Save deps cache
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      if: github.event_name != 'merge_group' && steps.runner-cache.outputs.hit != 'true' && steps.deps-cache.outputs.cache-hit != 'true'
      with:
        path: deps/
        key: ${{ steps.deps-cache.outputs.cache-primary-key }}

    - name: Save build cache
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      if: github.event_name != 'merge_group' && steps.runner-cache.outputs.hit != 'true' && inputs.build-app == 'true' && steps.build-cache.outputs.cache-hit != 'true'
      with:
        path: |
          _build/${{ env.MIX_ENV || 'dev' }}/lib
          _build/${{ env.MIX_ENV || 'dev' }}/.mix
          _build/${{ env.MIX_ENV || 'dev' }}/consolidated
        key: ${{ steps.build-cache.outputs.cache-primary-key }}
