name: Setup Elixir Project
description: Checks out the code, configures Elixir, fetches dependencies, and manages build caching.
inputs:
  elixir-version:
    required: true
    description: Elixir version to set up
  otp-version:
    required: true
    description: OTP version to set up
  cache-key:
    required: false
    default: "v2"
    description: Cache key prefix for dependency and build caches
  build-app:
    required: false
    default: "true"
    description: Whether to compile the application
  build-deps:
    required: false
    default: "true"
    description: Whether to compile dependencies
  build-flags:
    required: false
    default: "--warnings-as-errors"
    description: Flags to pass to mix compile
  install-rebar:
    required: false
    default: "false"
    description: Whether to install rebar
  install-hex:
    required: false
    default: "false"
    description: Whether to install hex

outputs:
  otp-version:
    description: "Exact OTP version selected by the BEAM setup step"
    value: ${{ steps.beam.outputs.otp-version }}
  elixir-version:
    description: "Exact Elixir version selected by the BEAM setup step"
    value: ${{ steps.beam.outputs.elixir-version }}

runs:
  using: "composite"
  steps:
    - name: Setup elixir
      uses: erlef/setup-beam@fc68ffb90438ef2936bbb3251622353b3dcb2f93 # v1
      id: beam
      with:
        elixir-version: ${{ inputs.elixir-version }}
        otp-version: ${{ inputs.otp-version }}

    # Quality and Build/Test share compiled artifacts. Different compile-time
    # service ports invalidate the whole application, even on an exact cache hit.
    - name: Set shared test service ports
      if: env.MIX_ENV == 'test'
      run: |
        printf '%s\n' 'DB_PORT=5432' 'S3_PORT=8333' >> "$GITHUB_ENV"
      shell: sh

    - name: Get deps cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
      id: deps-cache
      with:
        path: deps/
        key: deps-${{ inputs.cache-key }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ env.MIX_ENV || 'dev' }}-${{ hashFiles('mix.exs', 'config/**/*.exs') }}-${{ hashFiles('mix.lock') }}
        restore-keys: |
          deps-${{ inputs.cache-key }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ env.MIX_ENV || 'dev' }}-${{ hashFiles('mix.exs', 'config/**/*.exs') }}-

    - name: Get build cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
      id: build-cache
      with:
        # Keep PLTs out of the revision cache; they have their own lifecycle.
        path: |
          _build/${{ env.MIX_ENV || 'dev' }}/lib
          _build/${{ env.MIX_ENV || 'dev' }}/.mix
          _build/${{ env.MIX_ENV || 'dev' }}/consolidated
        key: build-${{ inputs.cache-key }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ env.MIX_ENV || 'dev' }}-${{ hashFiles('mix.exs', 'config/**/*.exs') }}-${{ hashFiles('mix.lock') }}-${{ github.event.pull_request.head.sha || github.sha }}
        restore-keys: |
          build-${{ inputs.cache-key }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ env.MIX_ENV || 'dev' }}-${{ hashFiles('mix.exs', 'config/**/*.exs') }}-${{ hashFiles('mix.lock') }}-

    - name: Get Hex cache
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      id: hex-cache
      if: steps.deps-cache.outputs.cache-hit != 'true'
      with:
        path: ~/.hex
        key: hex-${{ inputs.cache-key }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ env.MIX_ENV || 'dev' }}-${{ hashFiles('mix.lock') }}
        restore-keys: |
          hex-${{ inputs.cache-key }}-${{ runner.os }}-${{ runner.arch }}-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ env.MIX_ENV || 'dev' }}-

    - name: Install Rebar
      run: mix local.rebar --force
      shell: sh
      if: inputs.install-rebar == 'true'

    - name: Install Hex
      run: mix local.hex --force
      shell: sh
      if: inputs.install-hex == 'true'

    - name: Install Dependencies
      run: mix deps.get
      shell: sh

    # Normally we'd use `mix deps.compile` here, however that incurs a large
    # performance penalty when the dependencies are already fully compiled:
    # https://elixirforum.com/t/github-action-cache-elixir-always-recompiles-dependencies-elixir-1-13-3/45994/12
    #
    # Accoring to Jose Valim at the above link `mix loadpaths` will check and
    # compile missing dependencies
    - name: Compile Dependencies
      run: mix loadpaths
      shell: sh
      if: inputs.build-deps == 'true'
      env:
        MIX_OS_DEPS_COMPILE_PARTITION_COUNT: 4

    - name: Compile Application
      run: mix compile ${{ inputs.build-flags }}
      shell: sh
      if: inputs.build-app == 'true'
      env:
        ERL_COMPILER_OPTIONS: "+JPn"

    - name: Download Locales
      run: mix localize.setup
      shell: sh
      if: inputs.build-app == 'true'

    # Save completed setup before a later quality check or test can fail.
    - name: Save deps cache
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
      if: steps.deps-cache.outputs.cache-hit != 'true'
      with:
        path: deps/
        key: ${{ steps.deps-cache.outputs.cache-primary-key }}

    - name: Save build cache
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
      if: inputs.build-app == 'true' && steps.build-cache.outputs.cache-hit != 'true'
      with:
        path: |
          _build/${{ env.MIX_ENV || 'dev' }}/lib
          _build/${{ env.MIX_ENV || 'dev' }}/.mix
          _build/${{ env.MIX_ENV || 'dev' }}/consolidated
        key: ${{ steps.build-cache.outputs.cache-primary-key }}
